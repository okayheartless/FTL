<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Ensure the background covers the entire viewport and beyond */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Page background (kept, no parallax) */
        html {
            background-image: url('/FTL_ASSETS/FTL_HOME_BG_DARK.jpg');
            background-position: center top; /* anchor to top so key detail stays visible */
            background-size: cover; /* ensure it fills the viewport */
            background-repeat: no-repeat;
        }

        * {
            box-sizing: border-box;
        }

        body {
            /* keep a camo overlay on top of the background image */
            background-image: url('/FTL_ASSETS/FTL_HOME_CAMO.jpg');
            background-attachment: scroll;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure no white background hides the camo */
            position: relative;
            z-index: 0;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .social-icons a:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .navigation-buttons .nav-button:nth-child(2),
        .navigation-buttons .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .navigation-buttons .nav-button:nth-child(2):hover,
        .navigation-buttons .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        /* Use block layout (not flex) so absolute children align to the banner image box */
        .logo-banner {
            position: relative;
            display: block; /* changed from flex to block to ensure predictable positioning */
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            text-align: center; /* center the inner wrapper */
        }

        /* Inner wrapper that exactly matches the banner image dimensions when scaled */
        .banner-inner {
            position: relative; /* positioning context for the overlay */
            width: 100%;
            max-width: 2304px; /* native banner width */
            display: block;
            margin: 0 auto; /* center the wrapper so overlay aligns with the visible image */
        }

        /* The banner image defines the visual size. It remains responsive. */
        .banner-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contact overlay image tied directly to banner dimensions.
           Key points:
           - absolute positioning relative to .banner-inner
           - width is a percentage of the banner width so it scales identically
           - no max-width/min-width clamping to avoid snapping behavior
        */
        .banner-contact-link {
            position: absolute;
            right: 5%;
            bottom: 33%; /* lower third */
            transform: rotate(3deg);
            transform-origin: center;
            z-index: 5;
            display: block;
            line-height: 0;
        }

        .banner-contact-img {
            display: block;
            width: 12%; /* exact proportion of banner width; adjust as needed */
            height: auto;
            max-width: none; /* important: prevents fallback clamping */
        }

        /* Remove any breakpoint that forces different absolute sizes. Keeping this strict
           proportional scaling requires not overriding .banner-contact-img width elsewhere. */

        /* Featured Content Area */
        .featured-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: transparent; /* allow camo to show through */
            min-height: 300px;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            margin-top: auto;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            /* On medium and small screens, slightly increase background-size to keep coverage */
            html { background-size: 120%; background-position: center top; }
        }

        @media (max-width: 768px) {
            .social-icons {
                gap: 30px;
                padding: 20px 10px;
            }

            .social-icons a {
                font-size: 12px;
            }

            .navigation-buttons-container {
                padding: 30px 40px;
            }

            .navigation-buttons .nav-button:nth-child(2),
            .navigation-buttons .nav-button:nth-child(4) {
                transform: translateY(-20px);
            }

            .navigation-buttons .nav-button:nth-child(2):hover,
            .navigation-buttons .nav-button:nth-child(4):hover {
                transform: translateY(-20px) scale(1.05);
            }

            /* For small devices zoom the background image to keep it filling the screen */
            html { background-size: 140%; background-position: center top; }
        }
    </style>
</head>
<body>
    <!-- Social Media Links -->
    <div class="social-icons">
        <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram">INSTAGRAM</a>
        <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube">YOUTUBE</a>
        <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud">SOUNDCLOUD</a>
        <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord">DISCORD</a>
    </div>

    <!-- Main Navigation Buttons Container -->
    <div class="navigation-buttons-container">
        <div class="navigation-buttons">
            <a href="https://frontlineug.com/artist" class="nav-button" title="Assets">
                <img src="FTL_ASSETS/FTL_ARTIST_IMAGE.png" alt="Artist">
            </a>
            <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                <img src="FTL_ASSETS/FTL_PRODUCER_IMAGE.png" alt="Producer">
            </a>
            <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                <img src="FTL_ASSETS/FTL_WORK_IMAGE.png" alt="Work">
            </a>
            <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                <img src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact">
            </a>
            <!-- Replaced Store with Events -->
            <a href="https://frontlineug.com/events" class="nav-button" title="Events">
                <img src="FTL_ASSETS/FTL_EVENTS_IMAGE.png" alt="Events">
            </a>
        </div>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">
        <div class="banner-inner">
            <img class="banner-img" src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">

            <!-- Contact button drawn as an image so it scales proportionally with the banner -->
            <a href="https://frontlineug.com/contact" class="banner-contact-link" title="Contact" target="_blank" rel="noopener" aria-label="Contact Frontline">
                <img class="banner-contact-img" src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact">
            </a>
        </div>
    </div>

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">
        <div class="featured-content-placeholder">
            Add your image or video here
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>
</body>
</html>
