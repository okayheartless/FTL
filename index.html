<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 30px 20px;
            background-color: white;
        }

        .social-icons a {
            text-decoration: none;
            color: regular;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .social-icons a:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: white;
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 80px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .nav-button:nth-child(2),
        .nav-button:nth-child(4) {
            transform: translateY(-20px);
        }

        .nav-button:nth-child(2):hover,
        .nav-button:nth-child(4):hover {
            transform: translateY(-20px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: white;
            width: 100%;
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Featured Content Area */
        .featured-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: white;
            min-height: 300px;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: white;
            width: 100%;
            margin-top: auto;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .social-icons {
                gap: 30px;
                padding: 20px 10px;
            }

            .social-icons a {
                font-size: 12px;
            }

            .navigation-buttons-container {
                padding: 30px 40px;
            }

            .nav-button:nth-child(2),
            .nav-button:nth-child(4) {
                transform: translateY(-10px);
            }

            .nav-button:nth-child(2):hover,
            .nav-button:nth-child(4):hover {
                transform: translateY(-10px) scale(1.05);
            }
        }
    </style>
</head>
<body>
    <!-- Social Media Links -->
    <div class="social-icons">
        <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram">INSTAGRAM</a>
        <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube">YOUTUBE</a>
        <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud">SOUNDCLOUD</a>
        <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord">DISCORD</a>
    </div>

    <!-- Main Navigation Buttons Container -->
    <div class="navigation-buttons-container">
        <div class="navigation-buttons">
            <a href="https://frontlineug.com/artist" class="nav-button" title="Assets">
                <img src="FTL_ASSETS/FTL_ARTIST_IMAGE.png" alt="Artist">
            </a>
            <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                <img src="FTL_ASSETS/FTL_PRODUCER_IMAGE.png" alt="Producer">
            </a>
            <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                <img src="FTL_ASSETS/FTL_WORK_IMAGE.png" alt="Work">
            </a>
            <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                <img src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact">
            </a>
            <a href="https://frontlineug.com/store" class="nav-button" title="Store">
                <img src="FTL_ASSETS/FTL_STORE_IMAGE.png" alt="Store">
            </a>
        </div>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">
        <img src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">
    </div>

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">
        <div class="featured-content-placeholder">
            Add your image or video here
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>
</body>
</html>
