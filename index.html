<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Ensure the background covers the entire viewport and beyond */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Page background (kept, no parallax) */
        html {
            background-image: url('/FTL_ASSETS/FTL_HOME_BG_DARK.jpg');
            background-position: center top; /* anchor to top so key detail stays visible */
            background-size: cover; /* ensure it fills the viewport */
            background-repeat: no-repeat;
        }

        * {
            box-sizing: border-box;
        }

        body {
            /* keep a camo overlay on top of the background image */
            background-image: url('/FTL_ASSETS/FTL_HOME_CAMO.jpg');
            background-attachment: scroll;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure no white background hides the camo */
            position: relative;
            z-index: 0;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .social-icons a:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .navigation-buttons .nav-button:nth-child(2),
        .navigation-buttons .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .navigation-buttons .nav-button:nth-child(2):hover,
        .navigation-buttons .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            position: relative; /* make button fixed relative to this banner */
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            /* Ensure we can size children relative to banner - use the banner as reference */
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contact button on the banner */
        /*
            To ensure the button scales together with the banner image, sizes are expressed
            using percentages relative to the banner container and viewport-based calculations.
            - position in percentages keeps it anchored relative to the banner
            - width/max-width and padding in % tie the button dimensions to the banner width
            - font-size uses a small viewport-based calc so text scales smoothly as the banner scales
        */
        .banner-contact-button {
            position: absolute;
            right: 5%; /* right side of banner */
            bottom: 18%; /* place in the lower third of the banner */
            transform: rotate(3deg);
            transform-origin: center;
            z-index: 5; /* above the banner image */

            display: inline-block;
            /* size relative to banner width so it scales together */
            max-width: 18%;
            padding: 1.8% 3.2%; /* percentage of banner's width */
            background: rgba(255, 204, 0, 0.95); /* high contrast, tweak as needed */
            color: #000;
            font-weight: 700;
            text-decoration: none;
            border-radius: 1.2%;
            box-shadow: 0 0.8% 2.2% rgba(0,0,0,0.35);
            letter-spacing: 1px;
            white-space: nowrap;
            transition: transform 0.18s ease, opacity 0.18s ease;

            /* scale text relative to the viewport so the label scales with the banner */
            font-size: calc(0.6vw + 0.6vh);
            line-height: 1;
            text-align: center;
        }

        .banner-contact-button:hover {
            opacity: 0.95;
            transform: rotate(3deg) scale(1.04); /* keep tilt while scaling */
        }

        /* Ensure the button never becomes too large on very wide screens */
        @media (min-width: 1600px) {
            .banner-contact-button { max-width: 12%; font-size: calc(0.5vw + 0.4vh); }
        }

        /* Small viewports - keep button proportional to banner but more usable */
        @media (max-width: 768px) {
            .banner-contact-button {
                right: 4%;
                bottom: 10%;
                padding: 2.6% 4.6%;
                font-size: calc(1.6vw + 0.8vh);
                max-width: 34%;
                border-radius: 2.2%;
            }
        }

        /* Featured Content Area */
        .featured-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: transparent; /* allow camo to show through */
            min-height: 300px;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            margin-top: auto;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            /* On medium and small screens, slightly increase background-size to keep coverage */
            html { background-size: 120%; background-position: center top; }
        }

        @media (max-width: 768px) {
            .social-icons {
                gap: 30px;
                padding: 20px 10px;
            }

            .social-icons a {
                font-size: 12px;
            }

            .navigation-buttons-container {
                padding: 30px 40px;
            }

            .navigation-buttons .nav-button:nth-child(2),
            .navigation-buttons .nav-button:nth-child(4) {
                transform: translateY(-20px);
            }

            .navigation-buttons .nav-button:nth-child(2):hover,
            .navigation-buttons .nav-button:nth-child(4):hover {
                transform: translateY(-20px) scale(1.05);
            }

            /* For small devices zoom the background image to keep it filling the screen */
            html { background-size: 140%; background-position: center top; }
        }
    </style>
</head>
<body>
    <!-- Social Media Links -->
    <div class="social-icons">
        <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram">INSTAGRAM</a>
        <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube">YOUTUBE</a>
        <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud">SOUNDCLOUD</a>
        <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord">DISCORD</a>
    </div>

    <!-- Main Navigation Buttons Container -->
    <div class="navigation-buttons-container">
        <div class="navigation-buttons">
            <a href="https://frontlineug.com/artist" class="nav-button" title="Assets">
                <img src="FTL_ASSETS/FTL_ARTIST_IMAGE.png" alt="Artist">
            </a>
            <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                <img src="FTL_ASSETS/FTL_PRODUCER_IMAGE.png" alt="Producer">
            </a>
            <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                <img src="FTL_ASSETS/FTL_WORK_IMAGE.png" alt="Work">
            </a>
            <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                <img src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact">
            </a>
            <!-- Replaced Store with Events -->
            <a href="https://frontlineug.com/events" class="nav-button" title="Events">
                <img src="FTL_ASSETS/FTL_EVENTS_IMAGE.png" alt="Events">
            </a>
        </div>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">
        <img src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">
        <!-- Contact button fixed relative to the banner -->
        <a href="https://frontlineug.com/contact" class="banner-contact-button" title="Contact" target="_blank" rel="noopener">CONTACT</a>
    </div>

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">
        <div class="featured-content-placeholder">
            Add your image or video here
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>
</body>
</html>
