<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Box sizing reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Ensure the background covers the entire viewport and beyond */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Background image on html (use relative path to work on GitHub Pages or subpaths) */
        html {
            background: url('FTL_ASSETS/FTL_HOME_BG.jpg') center center / cover no-repeat fixed;
        }

        body {
            /* switch to normal document flow so footer reliably sits after content */
            min-height: 100vh;
            display: block;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure html background shows through */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: inline-block;
            width: 48px; /* make anchors square for icons */
            height: 48px;
        }

        .social-icons a img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .social-icons a:hover {
            opacity: 0.85;
            transform: scale(1.1);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .nav-button:nth-child(2),
        .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .nav-button:nth-child(2):hover,
        .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            position: relative; /* make this the positioning context for the contact button */
            overflow: visible;
            z-index: 30; /* bring banner above the events area */
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contact button attached to the banner */
        .logo-banner .contact-button {
            position: absolute;
            /* place on the right side and lower third */
            right: 10%;
            bottom: 13.5%;
            width: 14.5%; /* scales smoothly with the banner width */
            height: auto;
            transform: rotate(3deg);
            transform-origin: center bottom;
            transition: transform 0.25s ease, opacity 0.25s ease, width 0.25s linear;
            display: inline-block;
            z-index: 35; /* ensure it sits above the banner image */
            will-change: transform, width;
        }

        .logo-banner .contact-button img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-banner .contact-button:hover {
            transform: rotate(3deg) scale(1.03);
            opacity: 0.95;
        }

        /* Featured Content Area */
        .featured-content {
            display: block; /* let height be determined by content so footer sits below */
            justify-content: center;
            align-items: center;
            padding: 8px 0 12px; /* tightened padding so posters sit closer under the banner */
            background-color: transparent; /* allow camo to show through */
            min-height: 0;
            box-sizing: border-box;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Full-bleed events area: stretch to viewport edges so posters nearly touch screen edges */
        .event-area {
            width: 100vw; /* full viewport width */
            margin-left: calc(50% - 50vw); /* center full-bleed inside page */
            box-sizing: border-box;
            padding: 0; /* remove padding so posters reach edges */
            overflow: visible;
            background: transparent;
            position: relative;
            z-index: 10; /* behind the logo-banner (logo-banner z-index:30) */
            margin-top: -120px; /* pull posters upward so they sit partially behind the banner; tweak as needed */
        }

        /* poster frame container stretches across viewport with small gaps */
        .poster-frame {
            display: flex;
            gap: 8px; /* very small gap between posters */
            width: 100%;
            padding: 0 6px 16px; /* tiny horizontal padding so edges aren't flush-into-device chrome */
            box-sizing: border-box;
            align-items: flex-start;
            justify-content: center; /* center posters inside viewport */
            max-width: none;
        }

        /* each poster fills roughly a third of viewport width minus gaps */
        .poster-item {
            position: relative;
            flex: 0 0 calc(33.333% - 8px); /* three columns, fixed basis */
            max-width: 320px; /* limit poster width so they appear smaller */
            min-width: 180px;
            display: block;
            box-sizing: border-box;
            padding: 0; /* remove inner padding so image touches frame */
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1), box-shadow 0.28s ease;
            transform-origin: center top;
            z-index: 1; /* keep posters beneath the logo-banner */
        }

        /* frame image positioned absolutely so it scales with the poster; kept inside flow because poster-item has no fixed height */
        .poster-item .poster-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }

        .poster-link {
            position: relative;
            z-index: 3;
            display: block;
            width: 100%;
            text-decoration: none;
            overflow: hidden;
            border-radius: 2px;
        }

        /* make poster images take the available width and be tall — aspect-ratio controls height */
        .poster-link img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 2 / 3; /* tall poster */
            object-fit: cover;
            box-shadow: 0 16px 36px rgba(0,0,0,0.38);
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1), filter 0.28s ease;
        }

        /* scale both frame and image together on hover */
        .poster-item:hover {
            transform: scale(1.05);
            z-index: 22; /* bring hovered poster above others but still under the logo-banner (which is 30) */
        }

        .poster-item:hover .poster-border {
            transform: scale(1.05);
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1);
        }

        .poster-item:hover .poster-link img {
            transform: translateY(-10px) scale(1.02);
            filter: brightness(1.02);
        }

        /* On very wide screens, let posters grow a bit more (fills viewport) */
        @media (min-width: 1600px) {
            .poster-link img { aspect-ratio: 2 / 3; }
            .poster-frame { gap: 10px; padding: 0 12px 20px; }
            .poster-item { max-width: 380px; flex: 0 0 calc(30% - 10px); }
            .event-area { margin-top: -150px; } /* a bit more overlap on large screens */
        }

        /* Stack posters on narrow screens and make them near-fullwidth */
        @media (max-width: 900px) {
            .poster-frame { flex-direction: column; gap: 18px; align-items: center; padding: 0 6px 18px; }
            .poster-item { width: 96%; max-width: 360px; flex: 0 0 auto; }
            .poster-item .poster-border { display: block; }
            .event-area { margin-top: -60px; } /* less overlap on small screens */
        }

        /* Footer - ensure it sits after content */
        footer {
            display: block;
            width: 100%;
            padding: 0;
            background-color: transparent;
            box-sizing: border-box;
            margin-top: 10px;
            clear: both;
            position: relative;
            z-index: 1;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

    </style>
</head>
<body>
    <!-- Social Media Links -->
    <div class="social-icons">
        <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram" aria-label="Instagram">
            <img src="FTL_ASSETS/FTL_INSTAGRAM_DOGTAG.png" alt="Instagram">
        </a>
        <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube" aria-label="YouTube">
            <img src="FTL_ASSETS/FTL_YOUTUBE_DOGTAG.png" alt="YouTube">
        </a>
        <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud" aria-label="SoundCloud">
            <img src="FTL_ASSETS/FTL_SOUNDCLOUD_DOGTAG.png" alt="SoundCloud">
        </a>
        <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord" aria-label="Discord">
            <img src="FTL_ASSETS/FTL_DISCORD_DOGTAG.png" alt="Discord">
        </a>
    </div>

    <!-- Main Navigation Buttons Container -->
    <div class="navigation-buttons-container">
        <div class="navigation-buttons">

                <img src="FTL_ASSETS/FTL_ARTIST_BADGE.png" alt="Artist">
            </a>
            <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                <img src="FTL_ASSETS/FTL_PRODUCER_BADGE.png" alt="Producer">
            </a>
            <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                <img src="FTL_ASSETS/FTL_VISUAL_BADGE.png" alt="Work">
            </a>
            <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                <img src="FTL_ASSETS/FTL_CONTACT_BADGE.png" alt="Contact">
            </a>
            <a href="https://frontlineug.com/events" class="nav-button" title="Events">
                <img src="FTL_ASSETS/FTL_EVENTS_BADGE.png" alt="Events">

        </div>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">

        <!-- Contact button attached to the banner. It scales with the banner width and is tilted 3deg. -->
        <a href="https://frontlineug.com/contact" class="contact-button" title="Contact Frontline">
            <img src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact Button">
        </a>
    </div>

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">
        <!-- Event posters sit directly below the logo banner. Each poster has its own decorative frame and occupies most of the horizontal space. -->
        <div class="event-area" aria-label="Featured events">
            <div class="poster-frame">

                <div class="poster-item" aria-hidden="false">
                    <!-- individual frame behind this poster -->
                    <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                    <a class="poster-link" href="https://frontlineug.com/events/event1" title="Event 1" aria-label="Open Event 1">
                        <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 1" loading="lazy">
                    </a>
                </div>

                <div class="poster-item" aria-hidden="false">
                    <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                    <a class="poster-link" href="https://frontlineug.com/events/event2" title="Event 2" aria-label="Open Event 2">
                        <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 2" loading="lazy">
                    </a>
                </div>

                <div class="poster-item" aria-hidden="false">
                    <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                    <a class="poster-link" href="https://frontlineug.com/events/event3" title="Event 3" aria-label="Open Event 3">
                        <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 3" loading="lazy">
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>
</body>
</html>
