<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Welcome to Frontline Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Scaling variables for easy future edits:
           --event-section-scale: scales the entire poster/frame section (gap, padding, max widths, vertical overlap)
           --frame-scale: scales the decorative frame behind each poster relative to the poster image
           --poster-scale: additional scale applied to poster + frame to make them slightly larger without changing the overlap
           Change these two variables at the top to adjust sizes site-wide for the event posters. */
        :root {
            --event-section-scale: 1.05; /* 1.10 = +10% overall section size */
            --frame-scale: 1.0;         /* 1.10 = +10% frame size relative to the poster */
            --poster-scale: 0.9;        /* 1.06 = +6% poster & frame size (tweak as needed) */
        }

        /* Box sizing reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

/* Ensure the background covers the entire viewport and beyond */
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

/* Use a static image as a fallback background for browsers that don't render the video */
html {
    background: #000 url('FTL_ASSETS/FTL_HOME_BG.jpg') center/cover no-repeat;
}

/* Fullscreen looping background video */
#bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
}

/* Optional dark overlay to improve readability */
#bg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: -1;
    pointer-events: none;
}
/*
         Make the page a column flex layout so footer can stick to bottom when content is short.
         The .site-content area grows to fill available vertical space.
        */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure html background shows through */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* The main content area should grow so footer sits at bottom on short pages */
        .site-content {
            flex: 1 0 auto;
            padding-bottom: 140px; /* reserve space for the fixed footer so content isn't covered */
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: inline-block;
            width: 48px; /* make anchors square for icons */
            height: 48px;
        }

        .social-icons a img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .social-icons a:hover {
            opacity: 0.85;
            transform: scale(1.1);
        }

        /* Navigation Buttons Container */
        /* Use responsive side padding (clamp) to avoid fixed large padding causing overflow */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px clamp(16px, 10vw, 150px);
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .nav-button:nth-child(2),
        .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .nav-button:nth-child(2):hover,
        .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            position: relative; /* make this the positioning context for the contact button */
            overflow: visible;
            z-index: 30; /* bring banner above the events area */
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contact button attached to the banner */
        .logo-banner .contact-button {
            position: absolute;
            /* place on the right side and lower third */
            right: 11.5%;
            bottom: 24.5%;
            width: 14.5%; /* scales smoothly with the banner width */
            height: auto;
            transform: rotate(3deg);
            transform-origin: center bottom;
            transition: transform 0.25s ease, opacity 0.25s ease, width 0.25s linear;
            display: inline-block;
            z-index: 35; /* ensure it sits above the banner image */
            will-change: transform, width;
        }

        .logo-banner .contact-button img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-banner .contact-button:hover {
            transform: rotate(3deg) scale(1.03);
            opacity: 0.95;
        }

        /* Featured Content Area */
        .featured-content {
            display: block; /* let height be determined by content so footer sits below */
            justify-content: center;
            align-items: center;
            padding: 8px 0 12px; /* tightened padding so posters sit closer under the banner */
            background-color: transparent; /* allow camo to show through */
            min-height: 0;
            box-sizing: border-box;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /*
         Events area:
         Avoid width:100vw which includes the scrollbar and can create horizontal overflow.
         Use width:100% and remove the negative margin so the section follows the page/container width.
        */
        .event-area {
            width: 100%;
            margin-left: 0;
            box-sizing: border-box;
            padding: 0; /* container padding handled by .poster-frame */
            overflow: visible;
            background: transparent;
            position: relative;
            z-index: 10; /* behind the logo-banner (logo-banner z-index:30) */
            margin-top: calc(-100px * var(--event-section-scale)); /* pulled upward slightly; reduced to lower the section a tiny amount */
        }

        .poster-frame {
            /* grid allows posters to expand evenly and fill the row */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: calc(28px * var(--event-section-scale)); /* equal spacing between posters, scaled */
            padding: 0 calc(28px * var(--event-section-scale)) calc(36px * var(--event-section-scale)); /* padding equals gap so spacing between edge and first/last item == gap */
            align-items: start;
            justify-items: center;
            box-sizing: border-box;
            max-width: none;
        }

        .poster-item {
            position: relative;
            width: 100%;
            max-width: calc(520px * var(--event-section-scale) * var(--poster-scale)); /* cap how large each poster grows on very wide screens, scaled */
            display: block;
            box-sizing: border-box;
            padding: 0; /* poster image is inset slightly from frame via .poster-link padding */
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1), box-shadow 0.28s ease;
            transform-origin: center top;
            z-index: 2; /* poster-item stack base (frame will be behind, image on top) */
            overflow: visible; /* allow scaled image and enlarged frame to extend */
            display: flex;
            justify-content: center;
        }

        /*
         Position the frame BEHIND the poster image and preserve its native aspect ratio.
         Use width only (height:auto) so the frame image is never squished; center it behind the poster.
         The frame image original resolution is 1334 x 1760 (width x height).
        */
        .poster-item .poster-border {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(calc(var(--frame-scale) * var(--poster-scale))); /* frame scaled via variables */
            /* make the frame a bit larger than the poster; adjust gap here if you want more visible edge */
            width: calc(100% * var(--poster-scale) + 56px * var(--event-section-scale));
            height: auto; /* preserve aspect ratio (1334 / 1760) */
            z-index: 1; /* behind the poster-link (z-index: 3) */
            pointer-events: none;
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1);
            image-rendering: auto;
        }

        /*
         The poster-link contains the image and sits above the frame.
         Use padding so the poster image does not fully touch the frame center.
        */
        .poster-link {
            position: relative;
            z-index: 3; /* above the frame */
            display: block;
            width: calc(100% * var(--poster-scale) - 36px * var(--event-section-scale));
            padding: calc(18px * var(--event-section-scale)); /* creates breathing room between image and frame */
            text-decoration: none;
            overflow: visible; /* allow scaled image to escape and not be clipped */
            border-radius: 2px;
            background: transparent;
            box-sizing: border-box;
        }

        .poster-link img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3; /* tall poster */
            object-fit: contain; /* changed from cover so the entire poster is shown without being cropped */
            object-position: center;
            box-shadow: none;
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1), filter 0.28s ease;
            will-change: transform;
            border-radius: 2px; /* slight rounding of the visible poster inside the frame */
            background-color: transparent;
        }

        /* Hover behavior: grow poster and frame, lift above siblings but remain under logo banner */
        .poster-item:hover {
            transform: translateY(-6px) scale(1.03);
            z-index: 25; /* higher than other posters but less than logo-banner (30) */
        }

        .poster-item:hover .poster-border {
            transform: translate(-50%, -50%) scale(calc(var(--frame-scale) * var(--poster-scale) * 1.03)); /* combine base frame-scale with hover growth */
        }

        .poster-item:hover .poster-link img {
            transform: translateY(-8px) scale(1.03);
            filter: brightness(1.02);
        }

        /* On very wide screens, allow posters to grow and increase overlap behind banner a bit */
        @media (min-width: 1600px) {
            .poster-frame { gap: calc(36px * var(--event-section-scale)); padding: 0 calc(36px * var(--event-section-scale)) calc(44px * var(--event-section-scale)); }
            .poster-item { max-width: calc(640px * var(--event-section-scale) * var(--poster-scale)); }
            .poster-item .poster-border { width: calc(100% * var(--poster-scale) + 80px * var(--event-section-scale)); }
            .event-area { margin-top: calc(-130px * var(--event-section-scale)); } /* a bit more overlap on large screens, but reduced to lower section slightly */
        }

        /* Stack posters on narrower screens and keep them near-fullwidth. Reduce overlap so footer remains reachable. */
        @media (max-width: 1100px) {
            .poster-frame { grid-template-columns: 1fr; gap: calc(18px * var(--event-section-scale)); padding: 0 calc(18px * var(--event-section-scale)) calc(22px * var(--event-section-scale)); }
            .poster-item { width: 100%; max-width: calc(480px * var(--event-section-scale) * var(--poster-scale)); }
            /* Reduce the frame "overhang" on small screens so the decorative border doesn't look oversized */
            .poster-item .poster-border { width: calc(100% * var(--poster-scale) + 16px * var(--event-section-scale)); transform: translate(-50%, -50%) scale(calc(var(--frame-scale) * var(--poster-scale))); }
            .poster-link { width: calc(100% * var(--poster-scale) - 24px * var(--event-section-scale)); padding: calc(12px * var(--event-section-scale)); }
            .event-area { margin-top: calc(-60px * var(--event-section-scale)); } /* less overlap on small screens, reduced to lower the section */
        }

        /* Footer - ensure it stays at the bottom by being outside .site-content; keep it natural flow */
       /* Footer */
        /* Make the footer sit flush at the bottom of the viewport and avoid layout gaps.
           We reserve space in `.site-content` so the footer does not cover page content. */
        .footer-section {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            padding: 0;
            text-align: center;
            overflow: hidden; /* clip any horizontal overflow from partner logos */
            z-index: 40;
            line-height: 0; /* remove small descender gap under images */
        }

        .footer-section img {
            position: relative;
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0; /* ensure no default margins create gaps */
            padding: 0;
        }

        .footer-partners {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            align-content: center; /* center wrapped rows vertically */
            flex-wrap: wrap; /* allow logos to wrap to additional lines on small screens */
            gap: 16px;
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 24px;
            z-index: 10;
            pointer-events: auto;
            box-sizing: border-box;
        }

        .footer-partners a {
            display: inline-flex;
            flex: 1 1 0; /* allow items to shrink evenly and wrap */
            align-items: center;
            justify-content: center;
            min-width: 0; /* allow flex items to become smaller than their contents if needed */
            max-width: 300px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .footer-partners a img {
            width: 100%; /* always scale to the anchor container width */
            max-width: 100%;
            height: auto;
            max-height: 100px;
            display: block;
            object-fit: contain; /* preserve logo aspect while fitting */
        }

        .footer-partners a:hover {
            transform: translateY(-4px);
            opacity: 0.92;
        }

        @media (max-width: 900px) {
            .footer-partners {
                gap: 12px;
                width: calc(100% - 32px);
                padding: 0 16px;
            }

            .footer-partners a {
                flex: 1 1 0;
                min-width: 0;
                max-width: 220px;
            }
        }

        @media (max-width: 700px) {
            .footer-partners {
                gap: 10px;
                width: calc(100% - 24px);
                padding: 0 12px;
            }

            /* Limit partners to two-per-row at small widths to avoid overflow */
            .footer-partners a {
                flex: 1 1 45%;
                min-width: 0;
                max-width: calc(50% - 12px);
            }

            .footer-partners a img { max-height: 64px; }
        }

        /* Extra small devices - reduce logo heights further and ensure no horizontal scroll */
        @media (max-width: 420px) {
            .footer-partners { padding: 0 8px; gap: 8px; }
            .footer-partners a { flex: 1 1 48%; max-width: calc(50% - 8px); }
            .footer-partners a img { max-height: 52px; }
            html, body { overflow-x: hidden; } /* last-resort safeguard on very small devices */
            .site-content { padding-bottom: 110px; }
        }

        /* Reduce reserved content space for medium and small screens */
        @media (max-width: 900px) {
            .site-content { padding-bottom: 120px; }
        }

        /* Optional: If you still see tiny horizontal overflows after the fixes above,
           you can uncomment the rule below as a last-resort safeguard.
           Note: hiding overflow may mask layout problems, so prefer fixing the root cause. */
        /* html, body { overflow-x: hidden; } */

    </style>
</head>
<body>
