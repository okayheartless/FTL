<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Scaling variables for easy future edits:
           --event-section-scale: scales the entire poster/frame section (gap, padding, max widths, vertical overlap)
           --frame-scale: scales the decorative frame behind each poster relative to the poster image
           --poster-scale: additional scale applied to poster + frame to make them slightly larger without changing the overlap
           Change these two variables at the top to adjust sizes site-wide for the event posters. */
        :root {
            --event-section-scale: 1.10; /* 1.10 = +10% overall section size */
            --frame-scale: 1.10;         /* 1.10 = +10% frame size relative to the poster */
            --poster-scale: 1.06;        /* 1.06 = +6% poster & frame size (tweak as needed) */
        }

        /* Box sizing reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Ensure the background covers the entire viewport and beyond */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Background image on html (use relative path to work on GitHub Pages or subpaths) */
        html {
            background: url('FTL_ASSETS/FTL_HOME_BG.jpg') center center / cover no-repeat fixed;
        }

        /*
         Make the page a column flex layout so footer can stick to bottom when content is short.
         The .site-content area grows to fill available vertical space.
        */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure html background shows through */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* The main content area should grow so footer sits at bottom on short pages */
        .site-content {
            flex: 1 0 auto;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: inline-block;
            width: 48px; /* make anchors square for icons */
            height: 48px;
        }

        .social-icons a img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .social-icons a:hover {
            opacity: 0.85;
            transform: scale(1.1);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .nav-button:nth-child(2),
        .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .nav-button:nth-child(2):hover,
        .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            position: relative; /* make this the positioning context for the contact button */
            overflow: visible;
            z-index: 30; /* bring banner above the events area */
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contact button attached to the banner */
        .logo-banner .contact-button {
            position: absolute;
            /* place on the right side and lower third */
            right: 11.5%;
            bottom: 24.5%;
            width: 14.5%; /* scales smoothly with the banner width */
            height: auto;
            transform: rotate(3deg);
            transform-origin: center bottom;
            transition: transform 0.25s ease, opacity 0.25s ease, width 0.25s linear;
            display: inline-block;
            z-index: 35; /* ensure it sits above the banner image */
            will-change: transform, width;
        }

        .logo-banner .contact-button img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-banner .contact-button:hover {
            transform: rotate(3deg) scale(1.03);
            opacity: 0.95;
        }

        /* Featured Content Area */
        .featured-content {
            display: block; /* let height be determined by content so footer sits below */
            justify-content: center;
            align-items: center;
            padding: 8px 0 12px; /* tightened padding so posters sit closer under the banner */
            background-color: transparent; /* allow camo to show through */
            min-height: 0;
            box-sizing: border-box;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /*
         Events area:
         - Use a full-bleed container and a grid for posters that expands to fill horizontal space.
         - Use equal padding on the poster-frame to match the grid gap so spacing between edges and posters is consistent.
        */
        .event-area {
            width: 100vw; /* full viewport width */
            margin-left: calc(50% - 50vw); /* center full-bleed inside page */
            box-sizing: border-box;
            padding: 0; /* container padding handled by .poster-frame */
            overflow: visible;
            background: transparent;
            position: relative;
            z-index: 10; /* behind the logo-banner (logo-banner z-index:30) */
            margin-top: calc(-100px * var(--event-section-scale)); /* pulled upward slightly; reduced to lower the section a tiny amount */
        }

        .poster-frame {
            /* grid allows posters to expand evenly and fill the row */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: calc(28px * var(--event-section-scale)); /* equal spacing between posters, scaled */
            padding: 0 calc(28px * var(--event-section-scale)) calc(36px * var(--event-section-scale)); /* padding equals gap so spacing between edge and first/last item == gap */
            align-items: start;
            justify-items: center;
            box-sizing: border-box;
            max-width: none;
        }

        .poster-item {
            position: relative;
            width: 100%;
            max-width: calc(520px * var(--event-section-scale) * var(--poster-scale)); /* cap how large each poster grows on very wide screens, scaled */
            display: block;
            box-sizing: border-box;
            padding: 0; /* poster image is inset slightly from frame via .poster-link padding */
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1), box-shadow 0.28s ease;
            transform-origin: center top;
            z-index: 2; /* poster-item stack base (frame will be behind, image on top) */
            overflow: visible; /* allow scaled image and enlarged frame to extend */
            display: flex;
            justify-content: center;
        }

        /*
         Position the frame BEHIND the poster image and preserve its native aspect ratio.
         Use width only (height:auto) so the frame image is never squished; center it behind the poster.
         The frame image original resolution is 1334 x 1760 (width x height).
        */
        .poster-item .poster-border {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(calc(var(--frame-scale) * var(--poster-scale))); /* frame scaled via variables */
            /* make the frame a bit larger than the poster; adjust gap here if you want more visible edge */
            width: calc(100% * var(--poster-scale) + 56px * var(--event-section-scale));
            height: auto; /* preserve aspect ratio (1334 / 1760) */
            z-index: 1; /* behind the poster-link (z-index: 3) */
            pointer-events: none;
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1);
            image-rendering: auto;
        }

        /*
         The poster-link contains the image and sits above the frame.
         Use padding so the poster image does not fully touch the frame center.
        */
        .poster-link {
            position: relative;
            z-index: 3; /* above the frame */
            display: block;
            width: calc(100% * var(--poster-scale) - 36px * var(--event-section-scale));
            padding: calc(18px * var(--event-section-scale)); /* creates breathing room between image and frame */
            text-decoration: none;
            overflow: visible; /* allow scaled image to escape and not be clipped */
            border-radius: 2px;
            background: transparent;
            box-sizing: border-box;
        }

        .poster-link img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3; /* tall poster */
            object-fit: cover;
            box-shadow: 0 16px 36px rgba(0,0,0,0.38);
            transition: transform 0.28s cubic-bezier(.2,.9,.2,1), filter 0.28s ease;
            will-change: transform;
            border-radius: 2px; /* slight rounding of the visible poster inside the frame */
        }

        /* Hover behavior: grow poster and frame, lift above siblings but remain under logo banner */
        .poster-item:hover {
            transform: translateY(-6px) scale(1.03);
            z-index: 25; /* higher than other posters but less than logo-banner (30) */
        }

        .poster-item:hover .poster-border {
            transform: translate(-50%, -50%) scale(calc(var(--frame-scale) * var(--poster-scale) * 1.03)); /* combine base frame-scale with hover growth */
        }

        .poster-item:hover .poster-link img {
            transform: translateY(-8px) scale(1.03);
            filter: brightness(1.02);
        }

        /* On very wide screens, allow posters to grow and increase overlap behind banner a bit */
        @media (min-width: 1600px) {
            .poster-frame { gap: calc(36px * var(--event-section-scale)); padding: 0 calc(36px * var(--event-section-scale)) calc(44px * var(--event-section-scale)); }
            .poster-item { max-width: calc(640px * var(--event-section-scale) * var(--poster-scale)); }
            .poster-item .poster-border { width: calc(100% * var(--poster-scale) + 80px * var(--event-section-scale)); }
            .event-area { margin-top: calc(-130px * var(--event-section-scale)); } /* a bit more overlap on large screens, but reduced to lower section slightly */
        }

        /* Stack posters on narrow screens and keep them near-fullwidth. Reduce overlap so footer remains reachable. */
        @media (max-width: 900px) {
            .poster-frame { grid-template-columns: 1fr; gap: calc(18px * var(--event-section-scale)); padding: 0 calc(18px * var(--event-section-scale)) calc(22px * var(--event-section-scale)); }
            .poster-item { width: 100%; max-width: calc(480px * var(--event-section-scale) * var(--poster-scale)); }
            .poster-item .poster-border { width: calc(100% * var(--poster-scale) + 32px * var(--event-section-scale)); }
            .poster-link { width: calc(100% * var(--poster-scale) - 24px * var(--event-section-scale)); padding: calc(12px * var(--event-section-scale)); }
            .event-area { margin-top: calc(-60px * var(--event-section-scale)); } /* less overlap on small screens, reduced to lower the section */
        }

        /* Footer - ensure it stays at the bottom by being outside .site-content; keep it natural flow */
        footer {
            display: block;
            width: 100%;
            padding: 0;
            background-color: transparent;
            box-sizing: border-box;
            margin-top: 0;
            clear: both;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

    </style>
</head>
<body>
    <div class="site-content">
        <!-- Social Media Links -->
        <div class="social-icons">
            <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram" aria-label="Instagram">
                <img src="FTL_ASSETS/FTL_INSTAGRAM_DOGTAG.png" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube" aria-label="YouTube">
                <img src="FTL_ASSETS/FTL_YOUTUBE_DOGTAG.png" alt="YouTube">
            </a>
            <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud" aria-label="SoundCloud">
                <img src="FTL_ASSETS/FTL_SOUNDCLOUD_DOGTAG.png" alt="SoundCloud">
            </a>
            <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord" aria-label="Discord">
                <img src="FTL_ASSETS/FTL_DISCORD_DOGTAG.png" alt="Discord">
            </a>
            <!-- NEW: Twitch icon -->
            <a href="https://www.twitch.tv/frontlineunderground" target="_blank" title="Twitch" aria-label="Twitch">
                <img src="FTL_ASSETS/FTL_TIWTCH_DOGTAG.png" alt="Twitch">
            </a>
        </div>

        <!-- Main Navigation Buttons Container -->
        <div class="navigation-buttons-container">
            <div class="navigation-buttons">
                <a href="https://frontlineug.com/artist" class="nav-button" title="Assets">
                    <img src="FTL_ASSETS/FTL_ARTIST_BADGE.png" alt="Artist">
                </a>
                <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                    <img src="FTL_ASSETS/FTL_PRODUCER_BADGE.png" alt="Producer">
                </a>
                <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                    <img src="FTL_ASSETS/FTL_VISUAL_BADGE.png" alt="Work">
                </a>
                <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                    <img src="FTL_ASSETS/FTL_CONTACT_BADGE.png" alt="Contact">
                </a>
                <a href="https://frontlineug.com/events" class="nav-button" title="Events">
                    <img src="FTL_ASSETS/FTL_EVENTS_BADGE.png" alt="Events">
                </a>
            </div>
        </div>

        <!-- Logo Banner -->
        <div class="logo-banner">
            <img src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">
            <!-- Contact button attached to the banner. It scales with the banner width and is tilted 3deg. -->
            <a href="https://frontlineug.com/contact" class="contact-button" title="Contact Frontline">
                <img src="FTL_ASSETS/FTL_CONTACT_STICKER.png" alt="Contact Button">
            </a>
        </div>

        <!-- Featured Content Area (for images/videos) -->
        <div class="featured-content">
            <!-- Event posters sit directly below the logo banner. Each poster has its own decorative frame and occupies most of the horizontal space. -->
            <div class="event-area" aria-label="Featured events">
                <div class="poster-frame">

                    <div class="poster-item" aria-hidden="false">
                        <!-- decorative frame behind this poster - now intentionally behind the poster -->
                        <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                        <a class="poster-link" href="https://frontlineug.com/events" title="Event 1" aria-label="Open Event 1">
                            <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 1" loading="lazy">
                        </a>
                    </div>

                    <div class="poster-item" aria-hidden="false">
                        <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                        <a class="poster-link" href="https://frontlineug.com/events" title="Event 2" aria-label="Open Event 2">
                            <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 2" loading="lazy">
                        </a>
                    </div>

                    <div class="poster-item" aria-hidden="false">
                        <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                        <a class="poster-link" href="https://frontlineug.com/events" title="Event 3" aria-label="Open Event 3">
                            <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 3" loading="lazy">
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>
</body>
</html>
