<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Ensure the background covers the entire viewport and beyond */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Parallax background layer (moved via JS on scroll) */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/FTL_ASSETS/FTL_HOME_BG_DARK.jpg');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -1;
            transform: translate3d(0,0,0) scale(1.05);
            will-change: transform;
            pointer-events: none;
        }

        /* Reduce motion for users who prefer it */
        @media (prefers-reduced-motion: reduce) {
            .parallax-bg { transform: none !important; }
        }

        * {
            box-sizing: border-box;
        }

        body {
            /* keep a camo overlay on top of the parallax background */
            background-image: url('/FTL_ASSETS/FTL_HOME_CAMO.jpg');
            background-attachment: scroll;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure no white background hides the camo */
            position: relative;
            z-index: 0;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .social-icons a:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .navigation-buttons .nav-button:nth-child(2),
        .navigation-buttons .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .navigation-buttons .nav-button:nth-child(2):hover,
        .navigation-buttons .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Featured Content Area */
        .featured-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: transparent; /* allow camo to show through */
            min-height: 300px;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            margin-top: auto;
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .social-icons {
                gap: 30px;
                padding: 20px 10px;
            }

            .social-icons a {
                font-size: 12px;
            }

            .navigation-buttons-container {
                padding: 30px 40px;
            }

            .navigation-buttons .nav-button:nth-child(2),
            .navigation-buttons .nav-button:nth-child(4) {
                transform: translateY(-20px);
            }

            .navigation-buttons .nav-button:nth-child(2):hover,
            .navigation-buttons .nav-button:nth-child(4):hover {
                transform: translateY(-20px) scale(1.05);
            }

            /* Disable parallax on small screens for stability */
            .parallax-bg { display: none; }
        }
    </style>
</head>
<body>
    <!-- Parallax background layer -->
    <div class="parallax-bg" aria-hidden="true"></div>

    <!-- Social Media Links -->
    <div class="social-icons">
        <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram">INSTAGRAM</a>
        <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube">YOUTUBE</a>
        <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud">SOUNDCLOUD</a>
        <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord">DISCORD</a>
    </div>

    <!-- Main Navigation Buttons Container -->
    <div class="navigation-buttons-container">
        <div class="navigation-buttons">
            <a href="https://frontlineug.com/artist" class="nav-button" title="Assets">
                <img src="FTL_ASSETS/FTL_ARTIST_IMAGE.png" alt="Artist">
            </a>
            <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                <img src="FTL_ASSETS/FTL_PRODUCER_IMAGE.png" alt="Producer">
            </a>
            <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                <img src="FTL_ASSETS/FTL_WORK_IMAGE.png" alt="Work">
            </a>
            <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                <img src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact">
            </a>
            <!-- Replaced Store with Events -->
            <a href="https://frontlineug.com/events" class="nav-button" title="Events">
                <img src="FTL_ASSETS/FTL_EVENTS_IMAGE.png" alt="Events">
            </a>
        </div>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">
        <img src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">
    </div>

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">
        <div class="featured-content-placeholder">
            Add your image or video here
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>

    <script>
        // Subtle parallax: background moves in the same direction as scroll but much slower
        (function() {
            const bg = document.querySelector('.parallax-bg');
            if (!bg) return;

            let latestKnownScrollY = 0;
            let ticking = false;
            const speed = 0.18; // smaller = more subtle

            function getMaxTranslate() {
                // Allow up to 15% of the viewport height to move for the subtle depth effect
                return Math.round(window.innerHeight * 0.15);
            }

            function onScroll() {
                latestKnownScrollY = window.pageYOffset || document.documentElement.scrollTop;
                requestTick();
            }

            function requestTick() {
                if (!ticking) requestAnimationFrame(update);
                ticking = true;
            }

            function update() {
                const max = getMaxTranslate();
                // Move background upward (negative) as page scrolls down, but at a reduced rate
                let translateY = -Math.round(latestKnownScrollY * speed);
                // Clamp so the background never moves so far that edges show
                if (translateY < -max) translateY = -max;
                if (translateY > 0) translateY = 0;

                // Keep a small scale buffer so the image always covers the viewport while moving
                bg.style.transform = 'translate3d(0,' + translateY + 'px,0) scale(1.06)';
                ticking = false;
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', function() { requestAnimationFrame(update); });

            // Initialize position on load
            update();
        })();
    </script>
</body>
</html>
