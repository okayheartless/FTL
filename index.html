<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Welcome to Frontlime Underground">
    <title>Frontline</title>

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>
        /* Box sizing reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Ensure the background covers the entire viewport and beyond */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Background image on html (use relative path to work on GitHub Pages or subpaths) */
        html {
            background: url('FTL_ASSETS/FTL_HOME_BG.jpg') center center / cover no-repeat fixed;
        }

        body {
            /* layout styles */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
            color: #000; /* default text color */
            background: transparent; /* ensure html background shows through */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Social Icons Section */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 30px 20px;
            background-color: transparent; /* allow camo to show through */
        }

        .social-icons a {
            text-decoration: none;
            color: black;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: inline-block;
            width: 48px; /* make anchors square for icons */
            height: 48px;
        }

        .social-icons a img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .social-icons a:hover {
            opacity: 0.85;
            transform: scale(1.1);
        }

        /* Navigation Buttons Container */
        .navigation-buttons-container {
            display: flex;
            justify-content: center;
            padding: 30px 150px;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
        }

        /* Main Navigation Buttons */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .nav-button {
            display: inline-flex;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
            min-width: 76px;
            justify-content: center;
            align-items: flex-end;
        }

        .nav-button img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .nav-button:hover {
            transform: scale(1.05);
        }

        /* Asymmetrical positioning for 2nd and 4th buttons */
        .nav-button:nth-child(2),
        .nav-button:nth-child(4) {
            transform: translateY(-35px);
        }

        .nav-button:nth-child(2):hover,
        .nav-button:nth-child(4):hover {
            transform: translateY(-35px) scale(1.05);
        }

        /* Logo Banner Section */
        .logo-banner {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            position: relative; /* make this the positioning context for the contact button */
            overflow: visible;
        }

        .logo-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Contact button attached to logo banner */
        .logo-banner .contact-button {
            position: absolute;
            /* place on the right side and lower third */
            right: 10%;
            bottom: 13.5%;
            width: 13%; /* scales smoothly with the banner width */
            width: 14.5%; /* scales smoothly with the banner width */
            height: auto;
            transform: rotate(3deg);
            transform-origin: center bottom;
            transition: transform 0.25s ease, opacity 0.25s ease, width 0.25s linear;
            display: inline-block;
            z-index: 2; /* ensure it sits above the banner image */
            will-change: transform, width;
        }

        .logo-banner .contact-button img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-banner .contact-button:hover {
            transform: rotate(3deg) scale(1.03);
            opacity: 0.95;
        }

        /* Featured Content Area */
        .featured-content {
            display: block; /* let height be determined by content so footer sits below */
            justify-content: center;
            align-items: center;
            padding: 18px 20px 32px; /* reduce top padding so posters sit closer under the banner */
            background-color: transparent; /* allow camo to show through */
            min-height: 0;
        }

        .featured-content-placeholder {
            text-align: center;
            color: #999;
            font-size: 18px;
            background: rgba(255,255,255,0.0); /* explicit transparent fallback */
        }

        .featured-content img,
        .featured-content video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* New: Event posters area (each poster gets its own framed section) */
        .event-area {
            width: 100%;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            padding: 8px 12px 0; /* slight padding so the posters sit snugly under the banner */
            max-width: 1400px;
            margin: 0 auto;
        }

        .poster-frame {
            display: flex;
            gap: 20px; /* small gap between posters */
            width: 100%;
            padding: 10px 8px 22px;
            box-sizing: border-box;
            align-items: flex-start;
            justify-content: space-between;
        }

        /* Each poster item contains its own border image (frame) positioned behind the poster */
        .poster-item {
            position: relative;
            flex: 1 1 calc((100% - 40px) / 3); /* three large items with gap accounted for */
            max-width: calc((100% - 40px) / 3);
            min-width: 180px;
            display: block;
            box-sizing: border-box;
            padding: 10px; /* inner padding between frame and neighboring posters */
        }

        /* frame image placed absolutely inside each poster-item so it doesn't affect document flow */
        .poster-item .poster-border {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* keep the frame proportions */
            z-index: 1;
            pointer-events: none;
        }

        /* the clickable poster sits above the border/frame in normal document flow */
        .poster-link {
            position: relative;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .poster-link img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .poster-link:hover {
            transform: translateY(-6px) scale(1.01);
            transition: transform 0.25s ease;
        }

        /* make posters larger on wider screens */
        @media (min-width: 1200px) {
            .poster-item { max-width: 420px; }
        }

        @media (max-width: 1024px) {
            .poster-item { max-width: 360px; }
            .poster-frame { gap: 16px; padding-bottom: 18px; }
        }

        @media (max-width: 768px) {
            .social-icons {
                gap: 18px;
                padding: 10px 5px;
            }

            .social-icons a {
                font-size: 12px;
                width: 100px;
                height: 100px;
            }

            .navigation-buttons-container {
                padding: 30px 40px;
            }

            .nav-button:nth-child(2),
            .nav-button:nth-child(4) {
                transform: translateY(-20px);
            }

            .nav-button:nth-child(2):hover,
            .nav-button:nth-child(4):hover {
                transform: translateY(-20px) scale(1.05);
            }

            /* stack posters vertically on narrow screens and make them larger relative to width */
            .poster-frame {
                flex-direction: column;
                gap: 20px;
                align-items: center;
            }

            .poster-item {
                flex: none;
                width: 92%;
                max-width: 640px;
                padding: 8px;
            }
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            padding: 0;
            background-color: transparent; /* allow camo to show through */
            width: 100%;
            margin-top: 0; /* ensure footer sits after content */
        }

        footer img {
            width: 100%;
            height: auto;
            display: block;
        }

    </style>
</head>
<body>
    <!-- Social Media Links -->
    <div class="social-icons">
        <a href="https://www.instagram.com/frontline.ug/" target="_blank" title="Instagram" aria-label="Instagram">
            <img src="FTL_ASSETS/FTL_INSTAGRAM_DOGTAG.png" alt="Instagram">
        </a>
        <a href="https://www.youtube.com/@FrontlineUnderground" target="_blank" title="YouTube" aria-label="YouTube">
            <img src="FTL_ASSETS/FTL_YOUTUBE_DOGTAG.png" alt="YouTube">
        </a>
        <a href="https://soundcloud.com/frontlineunderground" target="_blank" title="SoundCloud" aria-label="SoundCloud">
            <img src="FTL_ASSETS/FTL_SOUNDCLOUD_DOGTAG.png" alt="SoundCloud">
        </a>
        <a href="https://discord.com/invite/Exs5Kc3Mf6" target="_blank" title="Discord" aria-label="Discord">
            <img src="FTL_ASSETS/FTL_DISCORD_DOGTAG.png" alt="Discord">
        </a>
    </div>

    <!-- Main Navigation Buttons Container -->
    <div class="navigation-buttons-container">
        <div class="navigation-buttons">
            <a href="https://frontlineug.com/artist" class="nav-button" title="Assets">
                <img src="FTL_ASSETS/FTL_ARTIST_BADGE.png" alt="Artist">
            </a>
            <a href="https://frontlineug.com/producer" class="nav-button" title="Producer">
                <img src="FTL_ASSETS/FTL_PRODUCER_BADGE.png" alt="Producer">
            </a>
            <a href="https://frontlineug.com/work" class="nav-button" title="Work">
                <img src="FTL_ASSETS/FTL_VISUAL_BADGE.png" alt="Work">
            </a>
            <a href="https://frontlineug.com/contact" class="nav-button" title="Contact">
                <img src="FTL_ASSETS/FTL_CONTACT_BADGE.png" alt="Contact">
            </a>
            <a href="https://frontlineug.com/events" class="nav-button" title="Events">
                <img src="FTL_ASSETS/FTL_EVENTS_BADGE.png" alt="Events">
            </a>
        </div>
    </div>

    <!-- Logo Banner -->
    <div class="logo-banner">
        <img src="FTL_ASSETS/FTL_LOGO_BANNER.png" alt="FTL Logo Banner">
        <!-- Contact button attached to the banner. It scales with the banner width and is tilted 3deg. -->
        <a href="https://frontlineug.com/contact" class="contact-button" title="Contact Frontline">
            <img src="FTL_ASSETS/FTL_CONTACT_IMAGE.png" alt="Contact Button">
        </a>
    </div>

    <!-- Featured Content Area (for images/videos) -->
    <div class="featured-content">
        <!-- Event posters sit directly below the logo banner. Each poster has its own decorative frame and occupies most of the horizontal space. -->
        <div class="event-area" aria-label="Featured events">
            <div class="poster-frame">

                <div class="poster-item" aria-hidden="false">
                    <!-- individual frame behind this poster -->
                    <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                    <a class="poster-link" href="https://frontlineug.com/events/event1" title="Event 1" aria-label="Open Event 1">
                        <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 1">
                    </a>
                </div>

                <div class="poster-item" aria-hidden="false">
                    <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                    <a class="poster-link" href="https://frontlineug.com/events/event2" title="Event 2" aria-label="Open Event 2">
                        <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 2">
                    </a>
                </div>

                <div class="poster-item" aria-hidden="false">
                    <img class="poster-border" src="FTL_ASSETS/FTL_EVENT_BORDER.png" alt="Event frame" aria-hidden="true">
                    <a class="poster-link" href="https://frontlineug.com/events/event3" title="Event 3" aria-label="Open Event 3">
                        <img src="FTL_ASSETS/POSTER.jpg" alt="Event Poster 3">
                    </a>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <img src="FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </footer>
</body>
</html>
