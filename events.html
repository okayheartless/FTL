<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The Events of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    background-image: url('/FTL_ASSETS/FTL_STORE_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
    color: #000;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

.logo-img {
  width: 100%;
  max-width: 760px;
  height: auto;
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover { transform: scale(1.05); }

/* GALLERY: cap at 3 columns */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(240px, 1fr)); /* max 3 columns */
  gap: 32px;
  padding: 0 28px 48px;
  align-items: start;
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
  position: relative; /* give stacking context for meta */
}
.item:hover { transform: translateY(-6px); }

/* Poster + frame setup (uses same approach as index.html) */
.thumb {
  position: relative;
  width: 100%;
  overflow: visible;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-bottom: 8px; /* room for meta row below */
}

/* Make the decorative border size follow the thumb/poster proportionally.
   Use a relative extra gap (min(56px,8%)) rather than a fixed large px value so the frame scales down on small screens. */
.poster-border {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(1); /* no independent scaling */
  width: calc(100% + min(56px, 8%));
  height: auto;
  z-index: 1; /* behind poster by default */
  pointer-events: none;
}

.poster-link {
  position: relative;
  z-index: 2;
  display: block;
  width: calc(100% - 36px);
  padding: 18px;
  text-decoration: none;
  background: transparent;
  overflow: visible;
}

/* Ensure the full poster image is visible regardless of its intrinsic dimensions.
   Use contain so the entire image is shown without cropping and allow max-height to prevent extreme tall images. */
.poster-link img {
  display: block;
  max-width: 100%;
  width: auto;         /* allow portrait or landscape images to size correctly */
  height: auto;        /* preserve aspect ratio */
  object-fit: contain; /* ensure whole image is visible */
  max-height: 70vh;    /* prevent extremely tall posters from pushing layout */
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
  transition: transform 0.28s cubic-bezier(.2,.9,.2,1), filter 0.28s ease;
  border-radius: 2px;
}
.item:hover .poster-link img { transform: translateY(-6px) scale(1.02); }

/* META ROW: name left, type right (directly under the poster) */
.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 4px 0 4px;
  font-size: 1rem;
  position: relative; /* allow z-index to take effect */
  z-index: 5; /* sit above border/frame */
  background: transparent;
}
.meta-row .name { text-align: left; font-weight: 700; }
.meta-row .type { text-align: right; font-weight: 900; }

/* Footer */
.footer-section {
    padding: 24px 0 0 0;
    text-align: center;
    margin-top: auto;
}
.footer-section img {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
}

/* Animation */
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* Responsive: 2 columns on medium screens */
@media (max-width: 1100px) {
  .gallery { grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 26px; padding: 0 22px 44px; }
  .poster-border { width: calc(100% + min(44px, 7%)); }
}

/* Small screens: single column */
@media (max-width: 420px) {
  .logo-container { padding: 20px 12px; }
  .gallery { gap: 18px; grid-template-columns: 1fr; padding: 0 14px 28px; }
  .poster-link { padding: 12px; }
  .poster-link img { height: auto; width: 100%; max-height: 60vh; }
  .meta-row { font-size: 0.98rem; }
  .poster-border { width: calc(100% + min(32px, 6%)); }
}

    </style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="/FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- FOOTER IMAGE -->
<div class="footer-section page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

<script>
/*
  Fill this array with event objects. If 'link' is set the poster will open that link in a new tab;
  Example:
    { name: 'Event Name', image: '/FTL_ASSETS/POSTER.jpg', type: 'Frontline', link: 'https://...' }
*/
const artists = [
  { name: 'Crosslink Season 3', image: '/FTL_ASSETS/POSTER.jpg', type: 'Frontline', link: 'https://www.instagram.com/p/DW2qYfYlNwI/?img_index=1' },
  // Add more entries here...
];

function openLink(url) {
  window.open(url, '_blank');
}

/* Generate gallery items from the artists array */
(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    // decorative border behind this poster (use same border from index)
    const border = document.createElement('img');
    border.className = 'poster-border';
    border.src = '/FTL_ASSETS/FTL_EVENT_BORDER.png';
    border.alt = '';

    const link = document.createElement('a');
    link.className = 'poster-link';
    link.href = a.link || '#';
    link.title = a.name;
    link.setAttribute('aria-label', a.name + (a.type ? ' — ' + a.type : ''));
    if (a.link) link.target = '_blank';

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;
    img.loading = 'lazy';

    link.appendChild(img);

    thumb.appendChild(border);
    thumb.appendChild(link);

    // meta row: name left, type right (under the poster)
    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = a.name;

    const typeEl = document.createElement('div');
    typeEl.className = 'type';
    typeEl.textContent = a.type || '';

    metaRow.appendChild(nameEl);
    metaRow.appendChild(typeEl);

    item.appendChild(thumb);
    item.appendChild(metaRow);

    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
