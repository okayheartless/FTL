<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The Events of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    background-image: url('/FTL_ASSETS/FTL_STORE_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
    color: #000;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

.logo-img {
  width: 100%;
  max-width: 760px;
  height: auto;
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover { transform: scale(1.05); }

/* GALLERY: cap at 3 columns */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(240px, 1fr)); /* max 3 columns */
  gap: 32px;
  padding: 0 28px 48px;
  align-items: start;
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
  position: relative; /* give stacking context for meta */
}
.item:hover { transform: translateY(-6px); }

/* Poster wrapper: contains poster image, frame and meta so they scale together */
.poster-wrapper {
  position: relative;
  width: 100%;
  display: block;
  overflow: visible;
}

/* Make the decorative border match the poster wrapper exactly so it always aligns.
   Use inset:0 and 100% sizing rather than independent scaling. */
.poster-wrapper .poster-border {
  position: absolute;
  inset: 0; /* fill the wrapper */
  width: 100%;
  height: 100%;
  object-fit: contain; /* preserve aspect ratio */
  z-index: 1; /* behind the poster image */
  pointer-events: none;
}

.poster-link {
  position: relative;
  z-index: 2;
  display: block;
  width: 100%;
  padding: 0; /* let image define size */
  text-decoration: none;
  background: transparent;
}

/* Ensure the full poster image is visible regardless of its intrinsic dimensions. */
.poster-link img {
  display: block;
  width: 100%;      /* fill wrapper width */
  height: auto;     /* preserve aspect ratio */
  object-fit: contain;
  max-height: 70vh; /* prevents extremely tall posters from breaking layout */
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
  transition: transform 0.28s cubic-bezier(.2,.9,.2,1), filter 0.28s ease;
  border-radius: 2px;
}
.item:hover .poster-link img { transform: translateY(-6px) scale(1.02); }

/* META: place over the lower area of the wrapper so it is on top of the frame and scales with it */
.poster-wrapper .meta-row {
  position: absolute;
  bottom: 6%;
  left: 6%;
  right: 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 0 8px;
  font-size: 1rem;
  z-index: 6; /* above poster and frame */
  background: transparent;
}
.poster-wrapper .meta-row .name { text-align: left; font-weight: 700; color: #000; }
.poster-wrapper .meta-row .type { text-align: right; font-weight: 900; color: #000; }

/* Footer */
.footer-section {
    padding: 24px 0 0 0;
    text-align: center;
    margin-top: auto;
}
.footer-section img {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
}

/* Animation */
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* Responsive: 2 columns on medium screens */
@media (max-width: 1100px) {
  .gallery { grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 26px; padding: 0 22px 44px; }
  .poster-wrapper .poster-border { /* slightly reduce inset on smaller screens */
    /* no-op: border fills wrapper so it naturally scales */
  }
}

/* Small screens: single column */
@media (max-width: 420px) {
  .logo-container { padding: 20px 12px; }
  .gallery { gap: 18px; grid-template-columns: 1fr; padding: 0 14px 28px; }
  .poster-link { padding: 0; }
  .poster-link img { max-height: 60vh; }
  .poster-wrapper .meta-row { bottom: 4%; left: 4%; right: 4%; font-size: 0.95rem; }
}

    </style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="/FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- FOOTER IMAGE -->
<div class="footer-section page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

<script>
/*
  Fill this array with event objects. If 'link' is set the poster will open that link in a new tab;
  Example:
    { name: 'Event Name', image: '/FTL_ASSETS/POSTER.jpg', type: 'Frontline', link: 'https://...' }
*/
const artists = [
  { name: 'Crosslink Season 3', image: '/FTL_ASSETS/POSTER.jpg', type: 'Frontline', link: 'https://www.instagram.com/p/DW2qYfYlNwI/?img_index=1' },
  // Add more entries here...
];

function openLink(url) {
  window.open(url, '_blank');
}

/* Generate gallery items from the artists array */
(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const wrapper = document.createElement('div');
    wrapper.className = 'poster-wrapper';

    // poster link (image)
    const link = document.createElement('a');
    link.className = 'poster-link';
    link.href = a.link || '#';
    link.title = a.name;
    link.setAttribute('aria-label', a.name + (a.type ? ' — ' + a.type : ''));
    if (a.link) link.target = '_blank';

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;
    img.loading = 'lazy';

    link.appendChild(img);

    // decorative border that fills the wrapper so it always aligns with the poster
    const border = document.createElement('img');
    border.className = 'poster-border';
    border.src = '/FTL_ASSETS/FTL_EVENT_BORDER.png';
    border.alt = '';

    // meta row: name left, type right (placed inside wrapper so it overlays the frame)
    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = a.name;

    const typeEl = document.createElement('div');
    typeEl.className = 'type';
    typeEl.textContent = a.type || '';

    metaRow.appendChild(nameEl);
    metaRow.appendChild(typeEl);

    // assemble wrapper: border is placed so it fills wrapper, link sits above it, meta overlays everything
    wrapper.appendChild(link);
    wrapper.appendChild(border);
    wrapper.appendChild(metaRow);

    item.appendChild(wrapper);
    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
