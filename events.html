<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The Events of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
     background-image: url('/FTL_ASSETS/FTL_WORK_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 30px 16px; /* reduced side padding for small screens */
}

.logo-img {
  width: 100%;        /* make responsive */
  max-width: 600px;   /* keep original max on desktop */
  height: auto;       /* preserve aspect ratio */
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover {
  transform: scale(1.05);
}
  
/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 28px;
  padding: 0 20px 40px; /* smaller side padding to avoid horizontal cutoff on mobile */
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}

.item:hover {
  transform: translateY(-4px);
}

/* IMAGE */
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  cursor: pointer; /* use pointer since thumbs open links */
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* NO SCALING */
.thumb:hover img {
  filter: brightness(70%);
}

/* CLICK FEEDBACK */
.thumb:active {
  transform: scale(0.98);
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.8em;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.thumb:hover .overlay {
  opacity: 1;
}

/* META ROW */
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: 1.4em;
  gap: 8px;
}

/* TITLE */
.title {
  font-family: 'Arial';
  font-size: 1.2em; /* increased for balance */
}

/* TEXT ALIGNMENT */
.title { text-align: left; }
.date { text-align: center; }
.type { text-align: right; }

/* TITLE */
.title span {
  display: inline-block;
  transform-origin: left;
  white-space: nowrap;
}

/* DATE */
.date span,
.type span {
  display: inline-block;
  transform-origin: center;
  white-space: nowrap;
}

       /* Footer */
        .footer-section {
            padding: 20px 0 0 0;
            text-align: center;
            margin-top: auto; /* push footer to the bottom when body is a flex column */
        }

        .footer-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Small tweaks for very small screens */
@media (max-width: 420px) {
  .logo-container { padding: 20px 12px; }
  .gallery { gap: 18px; }
  .title { font-size: 1.05em; }
}

    </style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="/FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- FOOTER IMAGE -->
<div class="footer-section page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

</body>
</html>
