<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The Events of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
    background-image: url('/FTL_ASSETS/FTL_STORE_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
    color: #000;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 40px 12px;
}

.logo-img { width: 100%; max-width: 760px; height: auto; display:block; }

/* GALLERY: centered, max 3 columns, responsive */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 32px;
  padding: 0 12px 48px; /* reduced side padding */
  max-width: calc(3 * 520px + 2 * 32px); /* cap to 3 columns */
  margin: 0 auto; /* center the gallery block */
  justify-items: center; /* center items inside their grid cells */
}

/* ITEM */
.item {
  width: 100%;
  max-width: 520px; /* controls poster width, used to center single item */
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}
.item:hover { transform: translateY(-6px); }

/* Poster wrapper: contains poster image and frame */
.poster-wrapper { position: relative; width: 100%; display:block; overflow: visible; }

/* frame scale variable (about 8% larger) */
:root { --frame-scale: 1.08; }
.poster-border {
  position: absolute;
  left: 50%; top: 50%;
  width: 100%; height: 100%;
  transform: translate(-50%, -50%) scale(var(--frame-scale));
  transform-origin: center;
  object-fit: contain;
  z-index: 2; /* behind poster */
  pointer-events: none;
  display: block;
}

.poster-link { display:block; width:100%; padding:0; z-index:3; position:relative; text-decoration:none; }
.poster-link img {
  display:block;
  width:100%; height:auto; object-fit:contain;
  max-height: 70vh; /* prevents extremely tall posters */
  border-radius: 2px;
  box-shadow: none; /* remove drop shadow */
  transition: transform 0.28s cubic-bezier(.2,.9,.2,1), filter 0.28s ease;
}
.item:hover .poster-link img { transform: translateY(-6px) scale(1.02); }

/* META: overlay on top of poster and frame; name left, type right */
.poster-wrapper .meta-row {
  position: absolute;
  bottom: 6%;
  left: 6%;
  right: 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 0 6px;
  font-size: 1rem;
  color: #000;
  z-index: 5; /* above poster and border */
  pointer-events: none; /* avoid intercepting clicks */
}
.poster-wrapper .meta-row .name { text-align: left; font-weight: 700; }
.poster-wrapper .meta-row .type { text-align: right; font-weight: 900; }

/* Footer */
.footer-section { padding: 24px 0 0 0; text-align: center; margin-top: auto; }
.footer-section img { width: 100%; height: auto; display: block; }

/* Animation */
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* Responsive tweaks */
@media (max-width: 1100px) {
  .gallery { grid-template-columns: repeat(2, minmax(220px, 1fr)); max-width: calc(2 * 520px + 1 * 32px); }
  :root { --frame-scale: 1.06; }
}
@media (max-width: 600px) {
  .gallery { grid-template-columns: 1fr; max-width: 520px; padding: 0 10px 28px; }
  :root { --frame-scale: 1.04; }
  .poster-wrapper .meta-row { bottom: 4%; left: 6%; right: 6%; font-size: 0.98rem; }
}

    </style>
</head>
<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="/FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<div class="gallery" aria-label="Events gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- FOOTER IMAGE -->
<div class="footer-section page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

<script>
/*
  Events array: add objects like:
  { name: 'Event title', image: '/FTL_ASSETS/POSTER.jpg', type: 'Frontline', link: 'https://...' }
*/
const artists = [
  { name: 'Crosslink Season 3', image: '/FTL_ASSETS/POSTER.jpg', type: 'Frontline', link: 'https://www.instagram.com/p/DW2qYfYlNwI/?img_index=1' },
];

function openLink(url) { window.open(url, '_blank'); }

(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = '';

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const wrapper = document.createElement('div');
    wrapper.className = 'poster-wrapper';

    const link = document.createElement('a');
    link.className = 'poster-link';
    link.href = a.link || '#';
    link.title = a.name;
    if (a.link) link.target = '_blank';

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;
    img.loading = 'lazy';

    link.appendChild(img);

    const border = document.createElement('img');
    border.className = 'poster-border';
    border.src = '/FTL_ASSETS/FTL_EVENT_BORDER.png';
    border.alt = '';

    // meta overlay: on top of poster and border
    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = a.name;

    const typeEl = document.createElement('div');
    typeEl.className = 'type';
    typeEl.textContent = a.type || '';

    metaRow.appendChild(nameEl);
    metaRow.appendChild(typeEl);

    // assemble: link (poster), border, then meta overlay appended into wrapper so meta sits on top
    wrapper.appendChild(link);
    wrapper.appendChild(border);
    wrapper.appendChild(metaRow);

    item.appendChild(wrapper);
    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
