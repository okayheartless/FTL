<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contact Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-image: url('/FTL_ASSETS/FTL_CONTACT_CAMO.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
        }

        /* Logo Section */
        .logo-section {
            padding: 30px 0;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section a {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .logo-section a:hover {
            transform: scale(1.05);
        }

        .logo-section img {
            max-width: 700px;
            height: auto;
        }

        /* Contact Container */
        .contact-container {
            flex: 1;
            padding: 0 40px 40px 40px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* remove white box and move spacing to wrapper */
        .contact-form {
            background-color: transparent;    /* no white background */
            padding: 0;                       /* remove inner padding so iframe is flush */
            border-radius: 0;
            box-shadow: none;
            text-align: center;
        }

        .contact-form h2 {
            margin: 30px 0; /* keep spacing for the heading */
            color: #000000;
            font-size: 28px;
            text-align: center;
        }

        /* Google Form iframe styles */
        .google-form-wrapper {
            display: flex;
            justify-content: center;
            padding: 30px;                    /* page spacing without white box */
        }

        /* Make the iframe fill most of the viewport so the embedded form doesn't scroll internally. */
        .google-form-iframe {
            width: 100%;
            max-width: 100%;
            /* Subtract approximate height of header/logo, page paddings, and footer so iframe fits without inner scroll */
            height: calc(100vh - 260px);
            min-height: 720px;
            border: none;                     /* remove iframe border */
            background: transparent;          /* best-effort (will not change contents of the form) */
        }

        .form-message {
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* Footer */
        .footer-section {
            padding: 20px 0 0 0;
            text-align: center;
            margin-top: auto;
        }

        .footer-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .contact-container {
                padding: 0 30px 30px 30px;
            }

            /* spacing now handled on the wrapper */
            .contact-form {
                padding: 0;
            }

            .contact-form h2 {
                font-size: 26px;
                margin: 24px 0;
            }

            .logo-section img {
                max-width: 220px;
            }

            .google-form-wrapper {
                padding: 24px;
            }

            .google-form-iframe {
                height: calc(100vh - 300px); /* a bit taller on medium screens */
                min-height: 820px;
            }
        }

        @media (max-width: 768px) {
            .contact-container {
                padding: 0 20px 30px 20px;
            }

            .contact-form {
                padding: 0;
            }

            .contact-form h2 {
                font-size: 24px;
                margin: 20px 0;
            }

            .logo-section img {
                max-width: 150px;
            }

            .google-form-wrapper {
                padding: 20px;
            }

            .google-form-iframe {
                height: calc(100vh - 320px); /* taller on smaller screens to reduce internal scroll */
                min-height: 900px;
            }
        }

        @media (max-width: 480px) {
            .contact-container {
                padding: 0 15px 20px 15px;
            }

            .contact-form {
                padding: 0;
            }

            .contact-form h2 {
                font-size: 20px;
                margin: 16px 0;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
            }

            .submit-button {
                font-size: 14px;
            }

            .google-form-wrapper {
                padding: 16px;
            }

            .google-form-iframe {
                height: calc(100vh - 320px); /* increase height for very small screens */
                min-height: 1000px;
            }
        }
    </style>
</head>
<body>
    <!-- Logo Section -->
    <div class="logo-section">
        <a href="https://frontlineug.com/" title="Back to Home">
            <img src="/FTL_ASSETS/FTL_LOGO.png" alt="FTL Logo">
        </a>
    </div>

    <!-- Contact Container -->
    <div class="contact-container">
        <div class="contact-form">

            <div class="google-form-wrapper">
                <!-- Embedded Google Form -->
                <iframe class="google-form-iframe" src="https://docs.google.com/forms/d/e/1FAIpQLScA54J6IWk3UtsBhTY8FJhCq4UagszacU-_lhvyXgdBs6Xnbw/viewform?embedded=true" frameborder="0" allowful[...]>
            </div>

        </div>
    </div>

    <!-- Footer Section -->
    <div class="footer-section">
        <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </div>

</body>
</html>
