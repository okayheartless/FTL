<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contact Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('/FTL_ASSETS/FTL_CONTACT_CAMO.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
        }

        /* Logo Section */
        .logo-section {
            padding: 30px 0;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section a {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .logo-section a:hover {
            transform: scale(1.05);
        }

        .logo-section img {
            max-width: 700px;
            height: auto;
        }

        /* Contact Container */
        .contact-container {
            flex: 1;
            padding: 0 40px 40px 40px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .contact-form {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .contact-form h2 {
            margin-bottom: 30px;
            color: #000000;
            font-size: 28px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #000000;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-family: 'Arial', Arial, sans-serif;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #333333;
            background-color: #fafafa;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .submit-button:hover {
            background-color: #333333;
        }

        .submit-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .form-message {
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* Footer */
        .footer-section {
            padding: 20px 0 0 0;
            text-align: center;
            margin-top: auto;
        }

        .footer-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-container {
                padding: 0 20px 30px 20px;
            }

            .contact-form {
                padding: 25px;
            }

            .contact-form h2 {
                font-size: 24px;
            }

            .logo-section img {
                max-width: 150px;
            }
        }

        @media (max-width: 480px) {
            .contact-container {
                padding: 0 15px 20px 15px;
            }

            .contact-form {
                padding: 20px;
            }

            .contact-form h2 {
                font-size: 20px;
            }

            .form-group input,
            .form-group textarea {
                font-size: 16px;
            }

            .submit-button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Logo Section -->
    <div class="logo-section">
        <a href="https://frontlineug.com/" title="Back to Home">
            <img src="/FTL_ASSETS/FTL_LOGO.png" alt="FTL Logo">
        </a>
    </div>

    <!-- Contact Container -->
    <div class="contact-container">
        <form class="contact-form" id="contactForm">
            <h2>Contact Us</h2>

            <div class="form-group">
                <label for="companyName">Company or Artist Name</label>
                <input type="text" id="companyName" name="companyName" required>
            </div>

            <div class="form-group">
                <label for="instagramLink">Instagram Link</label>
                <input type="url" id="instagramLink" name="instagramLink" placeholder="https://instagram.com/..." required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject for Inquiry</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <button type="submit" class="submit-button">Submit</button>

            <div class="form-message" id="formMessage"></div>
        </form>
    </div>

    <!-- Footer Section -->
    <div class="footer-section">
        <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="FTL Footer">
    </div>

    <script>
        const contactForm = document.getElementById('contactForm');
        const formMessage = document.getElementById('formMessage');

        contactForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get form data
            const formData = {
                companyName: document.getElementById('companyName').value,
                instagramLink: document.getElementById('instagramLink').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            // Show loading state
            const submitButton = contactForm.querySelector('.submit-button');
            const originalButtonText = submitButton.textContent;
            submitButton.textContent = 'Sending...';
            submitButton.disabled = true;

            try {
                // Send email using a backend service (you need to set this up)
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: 'frontlineunderground@gmail.com',
                        subject: `New Contact Form Submission: ${formData.subject}`,
                        name: formData.companyName,
                        instagram: formData.instagramLink,
                        email: formData.email,
                        message: formData.message
                    })
                });

                if (response.ok) {
                    // Success
                    formMessage.textContent = 'Thank you! Your message has been sent successfully.';
                    formMessage.className = 'form-message success';
                    contactForm.reset();
                    
                    // Hide message after 5 seconds
                    setTimeout(() => {
                        formMessage.className = 'form-message';
                    }, 5000);
                } else {
                    throw new Error('Failed to send email');
                }
            } catch (error) {
                // Error
                formMessage.textContent = 'An error occurred while sending your message. Please try again.';
                formMessage.className = 'form-message error';
                console.error('Error:', error);
            } finally {
                // Reset button state
                submitButton.textContent = originalButtonText;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
