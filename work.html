<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The Visuals of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
     background-image: url('/FTL_ASSETS/FTL_WORK_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 30px 16px; /* reduced side padding for small screens */
}

.logo-img {
  width: 100%;        /* make responsive */
  max-width: 600px;   /* keep original max on desktop */
  height: auto;       /* preserve aspect ratio */
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover {
  transform: scale(1.05);
}
  
/* GRID */
/* Increased the min tile size so there are fewer items per row. */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); /* larger thumbs => fewer per row */
  gap: 32px; /* slightly larger gap for bigger tiles */
  padding: 0 28px 48px; /* more side padding to balance larger tiles */
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}

.item:hover {
  transform: translateY(-6px);
}

/* IMAGE + FRAME */
.thumb {
  position: relative; /* positioning context for overlay/meta */
  width: 100%;
  /* Keep frame rectangular, same aspect ratio */
  aspect-ratio: 846 / 1440;
  overflow: visible; /* allow the frame graphic to show if it extends slightly */
  cursor: pointer; /* use pointer since thumbs open links */
  display: flex;
  align-items: flex-start; /* ensure the inner image sits near the top of the frame */
  justify-content: center;
  background-position: top center;
  background-repeat: no-repeat;
  background-size: 92% auto;
  transition: transform 0.18s ease;
  transform-origin: center;
}

/* scale the profile picture up along with the frame (slightly reduced now for better fit) */
.thumb img {
  position: absolute;
  top: 18%; /* keep image slightly higher in the frame */
  left: 50%;
  transform: translateX(-50%);
  width: 76%; /* reduced slightly from 82% so the picture fits better inside the frame */
  height: auto;
  max-width: 90%;
  object-fit: cover;
  display: block;
  border-radius: 6px; /* slight rounding */
  z-index: 0; /* behind meta */
  box-shadow: 0 8px 24px rgba(0,0,0,0.35); /* slightly larger shadow for scale */
}

/* Remove darkening on hover and instead scale the thumb slightly */
.thumb:hover {
  transform: scale(1.035);
}

/* CLICK FEEDBACK */
.thumb:active {
  transform: scale(0.98);
}

/* ensure overlay still covers full thumb area but don't darken */
.overlay {
  position: absolute;
  inset: 0;
  background: transparent; /* no dark overlay on hover */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.1em;
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: 1;
  text-shadow: none; /* remove any text shadow */
}

.thumb:hover .overlay {
  opacity: 1;
}

/* place meta in the bottom part of the rectangular frame (dog tag) */
/* stacked, centered layout: artist name above the type */
.meta {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 86%;
  display: flex;
  flex-direction: column; /* stack title and type vertically */
  justify-content: center;
  align-items: center; /* center text horizontally */
  gap: 8px; /* slightly larger gap for bigger text */
  font-size: 1.25em; /* increased base font size for meta */
  background: transparent; /* fully transparent */
  color: #000; /* black font */
  padding: 8px 14px; /* increased padding to match larger layout */
  border-radius: 12px;
  z-index: 2; /* appear above image and overlay */
  box-shadow: none; /* remove drop shadow */
  text-shadow: none; /* remove any text shadow */
  min-height: 0;
  line-height: 1.12;
  box-sizing: border-box;
}

/* make text centered and stacked */
.title {
  font-family: 'Arial';
  font-size: 1.3em; /* larger title for readability */
  font-weight: 700;
  color: #000; /* black font */
  text-align: center;
  text-shadow: none;
  overflow: visible;
  white-space: normal; /* allow wrapping if needed */
  padding-right: 0;
  padding-left: 0;
}

/* TYPE stacked under title and centered */
.type {
  font-weight: 900; /* bold type label */
  color: #000; /* black font */
  text-align: center;
  text-shadow: none;
  flex: 0 0 auto;
  margin-left: 0;
  white-space: nowrap;
  font-size: 1.05em; /* larger type label */
}

/* DATE (not used but keep) */
.date { text-align: center; }

/* TITLE span behavior */
.title span {
  display: inline-block;
  transform-origin: left;
}

/* DATE span */
.date span,
.type span {
  display: inline-block;
  transform-origin: center;
}

       /* Footer */
        .footer-section {
            padding: 24px 0 0 0;
            text-align: center;
            margin-top: auto; /* push footer to the bottom when body is a flex column */
        }

        .footer-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Add a mid breakpoint for medium screens (tablets/laptops) */
@media (max-width: 1024px) {
  .gallery {
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); /* moderate tile size on tablets/laptops */
    gap: 26px;
    padding: 0 22px 44px;
  }
  .thumb img { width: 72%; } /* slightly smaller on medium screens */
  .meta { font-size: 1.18em; bottom: 20%; padding: 7px 12px; gap: 7px; }
  .title { font-size: 1.38em; }
  .type { font-size: 1.08em; }
}

/* Small tweaks for very small screens */
@media (max-width: 420px) {
  .logo-container { padding: 20px 12px; }
  .gallery { gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); padding: 0 14px 28px; }
  .title { font-size: 1.02em; }
  /* reduce profile pic size on very small screens so frame still shows */
  .thumb img { top: 16%; width: 64%; max-width: 88%; }
  .meta { width: 92%; font-size: 1.02em; bottom: 18%; padding: 8px 12px; min-height: 0; gap: 6px; }
}

    </style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="/FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- FOOTER IMAGE -->
<div class="footer-section page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

<script>
/*
  Fill this array with artist objects. If 'link' is set the thumbnail will open that link in a new tab;
  We removed the lightbox: thumbnails without a link will not be clickable.
  Example:
    { name: 'Artist Name', image: '/path/to/image.jpg', type: 'cover art', link: 'https://soundcloud.com/artist' }
*/
const artists = [
  { name: 'Flight Reacts', image: 'FTL_ASSETS/PFP/flight reacts edit.png', type: 'Ayymwad', link: 'https://www.instagram.com/p/DWIAfgDij3t/' },
  { name: 'Coraline', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 225033.png', type: 'OBSSD + Itzberzerk', link: 'https://www.instagram.com/p/DXm6bQwkr7X/' },
  { name: 'MoBeats Champion', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 225140.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=Y68mjK2Typs' },
  { name: 'MoBeats Heal You', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 225100.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=fiIwhJZmwr4' },
  { name: 'Ealuhri Audiomack Performance', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 230433.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=cwvVlXDK_4k' },
  { name: '1Up Tee Audiomack Performance', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 230442.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=SiNc-MDeQV4' },
  { name: 'Malie Donn Audiomack Performance', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 230457.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=EsBedxfoiNA' },
  { name: 'Enphamus Audiomack Performance', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 230450.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=BEg25IJDyaw' },
  { name: 'Judah Weston & IsoKeys Audiomack Performance', image: 'FTL_ASSETS/PFP/Screenshot 2026-07-30 230506.png', type: 'OBSSD', link: 'https://www.youtube.com/watch?v=Fbn7aNMmiSk' },
  // Add more entries here...
];

function openLink(url) {
  window.open(url, '_blank');
}

/* Generate gallery items from the artists array */
(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  // list of available frame images
  const frames = [
    '/FTL_ASSETS/FTL_PICTURE_FRAME1.png',
    '/FTL_ASSETS/FTL_PICTURE_FRAME2.png',
    '/FTL_ASSETS/FTL_PICTURE_FRAME3.png'
  ];

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    // pick a random frame for this thumb
    const frame = frames[Math.floor(Math.random() * frames.length)];
    // set inline background-image so each thumb gets its own random frame
    thumb.style.backgroundImage = `url('${frame}')`;

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.textContent = a.link ? 'VIEW' : '';

    // meta will be placed over the frame inside the thumb
    const meta = document.createElement('div');
    meta.className = 'meta';

    const title = document.createElement('div');
    title.className = 'title';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = a.name;
    title.appendChild(titleSpan);

    const type = document.createElement('div');
    type.className = 'type';
    const typeSpan = document.createElement('span');
    typeSpan.textContent = a.type || '';
    type.appendChild(typeSpan);

    meta.appendChild(title);
    meta.appendChild(type);

    thumb.appendChild(img);
    thumb.appendChild(overlay);
    thumb.appendChild(meta); // place meta inside thumb so it sits over the frame

    // click behavior: only add click if link is present
    if (a.link) {
      thumb.addEventListener('click', (ev) => {
        openLink(a.link);
      });
      thumb.style.cursor = 'pointer';
    } else {
      thumb.style.cursor = 'default';
    }

    item.appendChild(thumb);

    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
