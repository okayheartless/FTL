<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The store of Frontline Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
     background-image: url('/FTL_ASSETS/FTL_STORE_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 30px 16px; /* reduced side padding for small screens */
}

.logo-img {
  width: 100%;        /* make responsive */
  max-width: 600px;   /* keep original max on desktop */
  height: auto;       /* preserve aspect ratio */
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover {
  transform: scale(1.05);
}
/* BEATSTARS */
.beatstars-section {
  padding: 20px 40px 70px;
}

.beatstars-embed {
  width: 100%;
  height: 72vh;
  min-height: 520px;
  max-height: 780px;
}

.beatstars-embed iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

       /* Footer */
        .footer-section {
            padding: 20px 0 0 0;
            text-align: center;
            margin-top: auto; /* push footer to the bottom when body is a flex column */
        }

        .footer-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Small tweaks for very small screens */
@media (max-width: 420px) {
  .logo-container { padding: 20px 12px; }
  .gallery { gap: 18px; }
  .title { font-size: 1.05em; }
}

    </style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="/FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>
<!-- BEAT STORE -->
<!-- if u want a custom title > <div class="section-title"><span>Beat Store</span></div> -->

<div class="beatstars-section">
  <div class="beatstars-embed">
    <iframe 
      src="https://player.beatstars.com/?storeId=150661"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>
</div>
<!-- FOOTER IMAGE -->
<div class="footer-section page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

<script>

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
