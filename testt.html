<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="description" content="The music network of Frontline Underground">

    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('/FTL_ASSETS/FTL_PRODUCER_CAMO.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            font-family: 'Arial', Arial, sans-serif;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-container {
            display: flex;
            justify-content: center;
            padding: 30px 16px;
        }

        .logo-img {
            width: 100%;
            max-width: 600px;
            height: auto;

            cursor: pointer;

            transition: 0.25s;

            display: block;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }


        /* =========================
           MUSIC FILTERS
        ========================= */

        .music-controls {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            padding: 0 20px 35px;
        }


        .filter-btn {

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 900;

            letter-spacing: 1px;

            text-transform: uppercase;

            padding: 12px 22px;

            border: 2px solid #000;

            background: #f3f1ee;

            color: #000;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

        }


        .filter-btn:hover {

            transform: translateY(-2px);

            background: #000;

            color: #fff;

        }


        .filter-btn.active {

            background: #000;

            color: #fff;

        }


        /* =========================
           GRID
        ========================= */

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 28px;

            padding: 0 20px 40px;

        }


        /* =========================
           ITEM
        ========================= */

        .item {

            display: flex;

            flex-direction: column;

            opacity: 0;

            transform: translateY(20px);

            animation: fadeUp 0.6s ease forwards;

            transition:
                transform 0.2s ease,
                opacity 0.25s ease;

        }


        .item:hover {

            transform: translateY(-4px);

        }


        /* =========================
           IMAGE + FRAME
        ========================= */

        .thumb {

            position: relative;

            width: 100%;

            aspect-ratio: 846 / 1440;

            overflow: visible;

            cursor: pointer;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            background-position: top center;

            background-repeat: no-repeat;

            background-size: 92% auto;

            transition: transform 0.18s ease;

            transform-origin: center;

        }


        /* =========================
           PROFILE IMAGE
        ========================= */

        .thumb img {

            position: absolute;

            top: 18%;

            left: 50%;

            transform: translateX(-50%);

            width: 72%;

            height: auto;

            max-width: 86%;

            object-fit: cover;

            display: block;

            border-radius: 5px;

            z-index: 0;

            box-shadow:
                0 6px 18px rgba(0,0,0,0.3);

        }


        .thumb:hover {

            transform: scale(1.03);

        }


        .thumb:active {

            transform: scale(0.98);

        }


        /* =========================
           OVERLAY
        ========================= */

        .overlay {

            position: absolute;

            inset: 0;

            background: transparent;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            font-size: 1em;

            opacity: 0;

            transition: opacity 0.25s ease;

            z-index: 1;

            text-shadow: none;

        }


        .thumb:hover .overlay {

            opacity: 1;

        }


        /* =========================
           META
        ========================= */

        .meta {

            position: absolute;

            bottom: 22%;

            left: 50%;

            transform: translateX(-50%);

            width: 86%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 6px;

            font-size: 1.12em;

            background: transparent;

            color: #000;

            padding: 6px 12px;

            border-radius: 12px;

            z-index: 2;

            box-shadow: none;

            text-shadow: none;

            min-height: 0;

            line-height: 1.1;

            box-sizing: border-box;

        }


        /* =========================
           NAME
        ========================= */

        .title {

            font-family: Arial, sans-serif;

            font-size: 1.3em;

            font-weight: 600;

            color: #000;

            text-align: center;

            text-shadow: none;

            overflow: visible;

            white-space: normal;

            padding-right: 0;

            padding-left: 0;

        }


        /* =========================
           LOCATION / TYPE
        ========================= */

        .type {

            font-weight: 900;

            color: #000;

            text-align: center;

            text-shadow: none;

            flex: 0 0 auto;

            margin-left: 0;

            white-space: nowrap;

            font-size: 1.02em;

        }


        /* =========================
           ROLE TAGS
        ========================= */

        .role-tags {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 5px;

            flex-wrap: wrap;

        }


        .role-tag {

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1px;

            text-transform: uppercase;

            padding: 4px 7px;

            background: #000;

            color: #fff;

            line-height: 1;

        }


        /* =========================
           TITLE SPANS
        ========================= */

        .title span {

            display: inline-block;

            transform-origin: left;

        }


        .date span,
        .type span {

            display: inline-block;

            transform-origin: center;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer-section {

            padding: 20px 0 0 0;

            text-align: center;

            margin-top: auto;

        }


        .footer-section img {

            width: 100%;

            max-width: 100%;

            height: auto;

            display: block;

        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeUp {

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 420px) {

            .logo-container {

                    repeat(auto-fit, minmax(220px, 1fr));

            }

                padding: 8px 12px;

                min-height: 0;

                gap: 6px;

            }


            .filter-btn {

                font-size: 12px;

                padding: 10px 15px;

            }

        }

/* ==========================================
   OPEN LINK
========================================== */

function openLink(url) {

    window.open(
        url,
        '_blank'
    );

}



/* ==========================================
   FRAMES
========================================== */

const frames = [

    '/FTL_ASSETS/FTL_PICTURE_FRAME1.png',

    '/FTL_ASSETS/FTL_PICTURE_FRAME2.png',

    '/FTL_ASSETS/FTL_PICTURE_FRAME3.png'

];



/* ==========================================
   RENDER GALLERY
========================================== */

function renderGallery(filter = 'all') {


    const gallery =
        document.querySelector('.gallery');


    gallery.innerHTML = '';


    const filteredMembers =
        filter === 'all'

            ? members

            : members.filter(member =>

                member.roles.includes(filter)

            );



    filteredMembers.forEach((member, index) => {


        const item =
            document.createElement('div');


        item.className = 'item';


        item.style.animationDelay =
            (index * 0.05) + 's';



        /* THUMB */

        const thumb =
            document.createElement('div');


        thumb.className = 'thumb';



        /* RANDOM FRAME */

        const frame =
            frames[
                Math.floor(
                    Math.random() * frames.length
                )
            ];


        thumb.style.backgroundImage =
            `url('${frame}')`;



        /* PROFILE IMAGE */

        const img =
            document.createElement('img');


        img.src = member.image;

        img.alt = member.name;



        /* OVERLAY */

        const overlay =
            document.createElement('div');


        overlay.className = 'overlay';


        overlay.textContent =
            member.link
                ? 'VIEW'
                : '';



        /* META */

        const meta =
            document.createElement('div');


        meta.className = 'meta';



        /* NAME */

        const title =
            document.createElement('div');


        title.className = 'title';


        const titleSpan =
            document.createElement('span');


        titleSpan.textContent =
            member.name;


        title.appendChild(titleSpan);



        /* LOCATION */

        const type =
            document.createElement('div');


        type.className = 'type';


        const typeSpan =
            document.createElement('span');


        typeSpan.textContent =
            member.type || '';


        type.appendChild(typeSpan);



        /* ROLE TAGS */

        const roleTags =
            document.createElement('div');


        roleTags.className =
            'role-tags';



        member.roles.forEach(role => {


            const roleTag =
                document.createElement('span');


            roleTag.className =
                'role-tag';


            roleTag.textContent =
                role;


            roleTags.appendChild(roleTag);


        });



        /* ASSEMBLE META */

        meta.appendChild(title);

        meta.appendChild(type);

        meta.appendChild(roleTags);



        /* ASSEMBLE THUMB */

        thumb.appendChild(img);

        thumb.appendChild(overlay);

        thumb.appendChild(meta);



        /* CLICK */

        if (member.link) {


            thumb.addEventListener(
                'click',

                () => {

                    openLink(member.link);

                }

            );


            thumb.style.cursor =
                'pointer';


        }

        else {


            thumb.style.cursor =
                'default';


        }



        /* ADD TO PAGE */

        item.appendChild(thumb);

        gallery.appendChild(item);


    });


}



/* ==========================================
   FILTER BUTTONS
========================================== */

const filterButtons =
    document.querySelectorAll(
        '.filter-btn'
    );


filterButtons.forEach(button => {


    button.addEventListener(
        'click',

        () => {


            const filter =
                button.dataset.filter;



            /* ACTIVE BUTTON */

            filterButtons.forEach(btn =>

                btn.classList.remove('active')

            );


            button.classList.add(
                'active'
            );



            /* RENDER FILTERED MEMBERS */

            renderGallery(filter);


        }

    );


});



/* ==========================================

========================================== */
