<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The artists of Frontline Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    
    <link rel="icon" href="FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="custom.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
  background-image: url('FTL_ASSETS/FTL_MUSIC_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Instrument Serif', Georgia, serif;
}

/* LOGO */
.logo-container {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 10;
}

.logo-img {
  width: min(340px, 38vw);
  height: auto;
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover {
  transform: scale(1.05);
}

.partner-button {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 10;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  transition: transform 0.25s ease;
}

.partner-button:hover,
.partner-button:focus-visible {
  transform: scale(1.05);
}

.partner-button img {
  display: block;
  width: min(340px, 38vw);
  height: auto;
}

.partner-dialog {
  position: fixed;
  inset: 48px;
  width: auto;
  height: auto;
  max-width: none;
  max-height: none;
  margin: 0;
  padding: 66px 58px 28px;
  border: 0;
  background: #000 url('FTL_ASSETS/FTL_PARTNER_FRAME.jpg') center / 100% 100% no-repeat;
  color: #fff;
  box-shadow: none;
  overflow: hidden;
}

.partner-dialog::backdrop {
  background: rgba(0, 0, 0, 0.72);
}

.partner-dialog[open] {
  display: flex;
  flex-direction: column;
  animation: spotlightIn 0.25s ease-out;
}

.partner-dialog h2 {
  margin-bottom: 18px;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 400;
  color: #fff;
}

.dialog-close {
  position: absolute;
  top: 34px;
  right: 44px;
  border: 0;
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 2rem;
  line-height: 1;
  cursor: pointer;
}

.form-embed {
  flex: 1;
  min-height: 0;
  border: 0;
  background: rgba(0, 0, 0, 0.35);
}

.form-embed iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
  
/* GRID */
.filter-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 190px 20px 24px;
}

.filter-button {
  border: 1px solid #000;
  padding: 8px 18px;
  background: rgba(255, 255, 255, 0.72);
  color: #000;
  font: inherit;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.filter-button:hover,
.filter-button:focus-visible,
.filter-button[aria-pressed="true"] {
  background: #000;
  color: #fff;
  transform: translateY(-2px);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* slightly larger thumbs */
  gap: 28px;
  padding: 0 20px 40px;
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}

.item:hover {
  transform: translateY(-4px);
}

/* IMAGE + FRAME */
.thumb {
  position: relative; /* positioning context for overlay/meta */
  width: 100%;
  /* Use the new frame aspect ratio (846 x 1440) so frames are rectangular */
  aspect-ratio: 846 / 1440;
  overflow: visible; /* allow the frame graphic to show if it extends slightly */
  cursor: pointer; /* use pointer since thumbs open links */
  display: flex;
  align-items: flex-start; /* ensure the inner image sits near the top of the frame */
  justify-content: center;
  /* frame background behind the profile image
     NOTE: the actual frame image is set per-thumb in JavaScript so each thumb can have a random frame.
     If JS is unavailable, there is no frame fallback here. */
  background-position: top center;
  background-repeat: no-repeat;
  /* make the full rectangular frame visible but preserve the frame's own ratio */
  background-size: 92% auto;
  /* enable smooth scaling on hover */
  transition: transform 0.18s ease;
  transform-origin: center;
}

/* the actual profile picture is placed inside the top portion of the rectangular frame */
.thumb img {
  position: absolute;
  top: 18%; /* moved slightly higher so image sits higher in the frame */
  left: 50%;
  transform: translateX(-50%);
  width: 72%; /* set width and let height auto to avoid stretching */
  height: auto;
  max-width: 86%;
  object-fit: cover;
  display: block;
  border-radius: 5px; /* subtle rounding if desired */
  z-index: 0; /* behind meta */
  box-shadow: 0 6px 18px rgba(0,0,0,0.3); /* subtle drop shadow */
}

/* Remove darkening on hover and instead scale the thumb slightly */
.thumb:hover {
  transform: scale(1.03);
}

/* CLICK FEEDBACK */
.thumb:active {
  transform: scale(0.98);
}

/* ensure overlay still covers full thumb area but don't darken */
.overlay {
  position: absolute;
  inset: 0;
  background: transparent; /* no dark overlay on hover */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1em;
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: 1;
  text-shadow: none; /* remove any text shadow */
}

.thumb:hover .overlay {
  opacity: 1;
}

/* place meta in the bottom part of the rectangular frame (dog tag) */
/* stacked, centered layout: artist name above the type */
.meta {
  position: absolute;
  /* move the dog tag higher (closer to top) by increasing bottom slightly */
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 86%;
  display: flex;
  flex-direction: column; /* stack title and type vertically */
  justify-content: center;
  align-items: center; /* center text horizontally */
  gap: 6px; /* small vertical gap between title and type */
  font-size: 1.12em; /* slightly larger font */
  background: transparent; /* made fully transparent per request */
  color: #000; /* make font black */
  padding: 6px 12px; /* comfortable padding */
  border-radius: 12px;
  z-index: 2; /* appear above image and overlay */
  box-shadow: none; /* remove drop shadow */
  text-shadow: none; /* remove any text shadow */
  min-height: 0; /* not forcing a large tappable area so it sits closer to image */
  line-height: 1.1;
  box-sizing: border-box;
}

/* make text centered and stacked */
.title {
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 1.3em; /* larger title */
  font-weight: 600;
  color: #000; /* black font */
  text-align: center; /* centered below picture */
  text-shadow: none; /* ensure no shadow */
  overflow: visible;
  white-space: normal; /* allow wrapping if needed */
  padding-right: 0;
  padding-left: 0;
}

/* TYPE stacked under title and centered */
.type {
  font-weight: 900; /* make the 'type' font bold as requested */
  color: #000; /* black font */
  text-align: center;
  text-shadow: none;
  flex: 0 0 auto;
  margin-left: 0;
  white-space: nowrap;
  font-size: 1.02em; /* match overall meta font sizing */
}

.role {
  font-size: 0.85em;
  font-weight: 400;
  text-transform: uppercase;
}

/* DATE (not used but keep) */
.date { text-align: center; }

/* TITLE span behavior */
.title span {
  display: inline-block;
  transform-origin: left;
}

/* DATE span */
.date span,
.type span {
  display: inline-block;
  transform-origin: center;
}

       /* Footer */
        .footer-section {
          min-height: 190px;
          flex-shrink: 0;
          margin-top: auto; /* push footer to the bottom when body is a flex column */
          background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.55) 32%, #000 82%);
        }

        .page-footer {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          align-items: end;
          gap: 1rem;
          padding: 110px 24px 24px;
          color: #f4f1e9;
          font-size: clamp(.9rem, 1.3vw, 1.1rem);
        }

        .page-footer .copyright {
          white-space: nowrap;
        }

        .footer-links {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: clamp(.8rem, 2vw, 2rem);
        }

        .page-footer a {
          color: inherit;
          text-decoration: none;
          transition: opacity .2s ease;
        }

        .page-footer a:hover,
        .page-footer a:focus-visible {
          opacity: .58;
        }

        .link-star {
          display: inline-flex;
          align-items: center;
          color: inherit;
          font-size: .55em;
          line-height: 1;
          opacity: .85;
        }

        .page-footer .credit {
          justify-self: end;
          text-align: right;
        }

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes spotlightIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

/* Small tweaks for very small screens */
@media (max-width: 420px) {
  .logo-container { top: 14px; left: 14px; }
  .partner-button { top: 14px; right: 14px; }
  .logo-img,
  .partner-button img { width: min(190px, 42vw); }
  .filter-controls { padding: 130px 12px 18px; gap: 8px; }
  .filter-button { padding: 7px 12px; font-size: 1rem; }
  .gallery { gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .title { font-size: 1.02em; }
  /* reduce profile pic size on very small screens so frame still shows */
  .thumb img { top: 16%; width: 66%; max-width: 88%; } /* moved slightly higher on tiny screens too */
  .meta { width: 92%; font-size: 1.02em; bottom: 18%; padding: 8px 12px; min-height: 0; gap: 6px; }
  .partner-dialog {
    inset: 14px;
    padding: 52px 28px 20px;
  }
  .page-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .75rem;
    padding: 110px 14px 24px;
    text-align: center;
  }
  .page-footer .credit { text-align: center; }
}

    </style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/">
    <img src="FTL_ASSETS/FTL_LOGO.png" class="logo-img" alt="Frontline UG Logo">
  </a>
</div>

<button class="partner-button" type="button" aria-label="Open partner contact form" aria-controls="partner-dialog">
  <img src="FTL_ASSETS/FTL_PARTNER_2.png" alt="Partner with Frontline Underground">
</button>

<dialog class="partner-dialog" id="partner-dialog" aria-labelledby="partner-dialog-title">
  <button class="dialog-close" type="button" aria-label="Close contact form">&times;</button>
  <h2 id="partner-dialog-title">Partner with Frontline</h2>
  <div class="form-embed">
    <!-- Replace the iframe src with the published Google Form embed URL. -->
    <iframe title="Frontline partner contact form" loading="lazy"></iframe>
  </div>
</dialog>

<div class="filter-controls" role="group" aria-label="Filter profiles by role">
  <button class="filter-button" type="button" data-filter="all" aria-pressed="true">ALL</button>
  <button class="filter-button" type="button" data-filter="artist" aria-pressed="false">ARTIST</button>
  <button class="filter-button" type="button" data-filter="prod" aria-pressed="false">PROD</button>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below. -->
</div>

<!-- FOOTER -->
<footer class="footer-section page-footer">
  <span class="copyright">© FRONTLINE 2026</span>
  <nav class="footer-links" aria-label="Footer links">
    <a href="https://frontlineug.com/contact">CONTACT</a>
    <span class="link-star" aria-hidden="true">★</span>
    <a href="https://frontlineug.com/about">WHY FRONTLINE ?</a>
    <span class="link-star" aria-hidden="true">★</span>
    <a href="https://frontlineug.com/music">PARTNER</a>
  </nav>
  <a class="credit" href="https://obssd.online/">DESIGNED BY OBSSD + HEARTLESS</a>
</footer>

<script>
/*
  Fill this array with artist objects. If 'link' is set the thumbnail will open that link in a new tab;
  We removed the lightbox: thumbnails without a link will not be clickable.
  Example:
    { name: 'Artist Name', image: '/path/to/image.jpg', type: 'cover art', link: 'https://soundcloud.com/artist' }
*/
const artists = [
  { name: 'Parei', image: 'https://i1.sndcdn.com/avatars-93SDNlezueIUFcK8-3FExlQ-t200x200.jpg', type: 'CA', link: 'https://soundcloud.com/user-483679538' },
  { name: 'Savedbydari', image: 'https://i1.sndcdn.com/avatars-MxSJsdZLPqvypeRr-isaoFA-t500x500.jpg', type: 'TX', link: 'https://soundcloud.com/ilyglockzy' },
  { name: 'Baby Maison', image: 'FTL_ASSETS/PFP/babymaison2.jpg', type: 'AL', link: 'https://soundcloud.com/maisoncampbell' },
  { name: 'MordiKeye', image: 'FTL_ASSETS/PFP/mordikeye2.PNG', type: 'LA', link: 'https://soundcloud.com/mordik3y3' },
  { name: 'MENACE', image: 'FTL_ASSETS/PFP/MENACE3.png', type: 'CA', link: 'https://linktr.ee/mxnvce' },
  { name: 'XandR', image: 'https://i1.sndcdn.com/avatars-G3946EO8t7igqN6R-eCXgzg-t200x200.jpg', type: 'IL', link: 'https://guns.lol/.xandr' },
  { name: 'Phace', image: 'https://i1.sndcdn.com/avatars-hSMKN0oF7W5KXxFI-i37enA-t200x200.jpg', type: 'CA', link: 'https://soundcloud.com/phxcee-19245964' },
    { name: 'Kappa', image: 'https://i1.sndcdn.com/avatars-AbuOwLpwElXCqW0A-zomotQ-t200x200.jpg', type: 'WA', link: 'https://soundcloud.com/06broken' },
    { name: 'Filayyy', image: 'https://i1.sndcdn.com/avatars-BYIxSNGnln95w5jy-zGcq8Q-t200x200.jpg', type: 'TN', link: 'https://soundcloud.com/matt-the-fat' },
    { name: 'Punt', image: 'https://i1.sndcdn.com/avatars-zJS8sxKOKXrUFTlR-PTBZyw-t200x200.jpg', type: 'US', link: 'https://soundcloud.com/user-572055262' },
    { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'SWE', link: 'https://soundcloud.com/3hunnaracks' },
    { name: 'Whotfismar', image: 'https://i1.sndcdn.com/avatars-31TYrHEZVpAWiEVz-wqUDhw-t200x200.jpg', type: 'LA', link: 'https://soundcloud.com/user-602672535' },
    { name: 'Bleach3k', image: 'https://i1.sndcdn.com/avatars-ipjiB43NwSwJXKx9-POIzsQ-t200x200.jpg', type: 'CAN', link: 'https://soundcloud.com/stoked-out' },
    { name: 'Kylei', image: 'https://i1.sndcdn.com/avatars-54eVyFxByoXvcjlz-FztjZw-t200x200.jpg', type: 'NY', link: 'https://soundcloud.com/kyleic' },
    { name: 'Ebony White', image: 'https://i1.sndcdn.com/avatars-RPEj9ci4CAtOpEqQ-lLo1Kg-t200x200.jpg', type: 'CAN', link: 'https://soundcloud.com/user-175937093' },
    { name: 'Avalon', image: 'https://i1.sndcdn.com/avatars-La6HHFzIBIkFMMz1-DNgpCg-t200x200.jpg', type: 'CA', link: 'https://soundcloud.com/findavalon' },
    { name: 'Baby Yaad', image: 'https://i1.sndcdn.com/avatars-hZfHHyG1IDLT0zsw-nSlHdw-t200x200.jpg', type: 'GA', link: 'https://soundcloud.com/babyyaad' },
    { name: 'Jjaey', image: 'FTL_ASSETS/PFP/jjaey2.jpg', type: 'JAP', link: 'https://soundcloud.com/jake-morrison-927780005' },
    { name: 'Jiyū', image: 'https://i1.sndcdn.com/avatars-hWQOjlyVXhh9uqpi-daU5rA-t200x200.jpg', type: 'GER', link: 'https://soundcloud.com/jiyuudat' },
    { name: 'ilyreddo', image: 'FTL_ASSETS/PFP/reddo2.jpg', type: 'US', link: 'https://soundcloud.com/ilyreddoofficial' },
    { name: 'Saint!', image: 'FTL_ASSETS/PFP/saint2.jpg', type: 'IL', link: 'https://soundcloud.com/glizzx-saucy' },
    { name: 'Aqoye', image: 'https://i1.sndcdn.com/avatars-QctyC4jkZdhp4GnN-HbK8bA-t200x200.jpg', type: 'TX', link: 'https://soundcloud.com/aqoye' },
    { name: 'YellerBoy', image: 'https://i1.sndcdn.com/avatars-zUf5jWq5MEqX4ryz-wTPGAA-t200x200.jpg', type: 'TX', link: 'https://soundcloud.com/ranteyella' },
    { name: 'Tjxwho', image: 'FTL_ASSETS/PFP/who2.png', type: 'MS', link: 'https://soundcloud.com/much0tj' },
    { name: 'Regel', image: 'https://i1.sndcdn.com/avatars-zan3ODpLP76oVzj2-x6q4NQ-t200x200.jpg', type: 'SWE', link: 'https://soundcloud.com/regelxdx' },
    { name: 'Blehsehs', image: 'FTL_ASSETS/PFP/blehsehs2.jpg', type: 'SWE', link: 'https://soundcloud.com/porcelaining' },

  // Add more entries here...
];

/* Set roles to ['artist'], ['prod'], or ['artist', 'prod'] for each profile. */
artists.forEach((person) => {
  if (!person.roles) person.roles = ['artist'];
});

function openLink(url) {
  window.open(url, '_blank');
}

const partnerDialog = document.querySelector('#partner-dialog');
const partnerButton = document.querySelector('.partner-button');
const closeDialogButton = partnerDialog.querySelector('.dialog-close');

partnerButton.addEventListener('click', () => partnerDialog.showModal());
closeDialogButton.addEventListener('click', () => partnerDialog.close());
partnerDialog.addEventListener('click', (event) => {
  if (event.target === partnerDialog) partnerDialog.close();
});

const filterButtons = document.querySelectorAll('.filter-button');
let activeFilter = 'all';

filterButtons.forEach((button) => {
  button.addEventListener('click', () => {
    activeFilter = button.dataset.filter;
    filterButtons.forEach((filterButton) => {
      filterButton.setAttribute('aria-pressed', String(filterButton === button));
    });
    renderGallery();
  });
});

/* Generate gallery items from profiles matching the selected role. */
function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  // list of available frame images
  const frames = [
    'FTL_ASSETS/FTL_PICTURE_FRAME1.png',
    'FTL_ASSETS/FTL_PICTURE_FRAME2.png',
    'FTL_ASSETS/FTL_PICTURE_FRAME3.png'
  ];

  artists
    .filter((person) => activeFilter === 'all' || person.roles.includes(activeFilter))
    .forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    // pick a random frame for this thumb
    const frame = frames[Math.floor(Math.random() * frames.length)];
    // set inline background-image so each thumb gets its own random frame
    thumb.style.backgroundImage = `url('${frame}')`;

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.textContent = a.link ? 'VIEW' : '';

    // meta will be placed over the frame inside the thumb
    const meta = document.createElement('div');
    meta.className = 'meta';

    const title = document.createElement('div');
    title.className = 'title';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = a.name;
    title.appendChild(titleSpan);

    const type = document.createElement('div');
    type.className = 'type';
    const typeSpan = document.createElement('span');
    typeSpan.textContent = a.type || '';
    type.appendChild(typeSpan);

    const role = document.createElement('div');
    role.className = 'role';
    role.textContent = a.roles.join(' / ');

    meta.appendChild(title);
    meta.appendChild(type);
    meta.appendChild(role);

    thumb.appendChild(img);
    thumb.appendChild(overlay);
    thumb.appendChild(meta); // place meta inside thumb so it sits over the frame

    // click behavior: only add click if link is present
    if (a.link) {
      thumb.addEventListener('click', (ev) => {
        openLink(a.link);
      });
      thumb.style.cursor = 'pointer';
    } else {
      thumb.style.cursor = 'default';
    }

    item.appendChild(thumb);

    gallery.appendChild(item);
    });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
}

renderGallery();
</script>

</body>
</html>
