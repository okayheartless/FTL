<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="About Frontline Underground">
	<link rel="canonical" href="https://frontlineug.com/about">
	<meta property="og:type" content="website">
	<meta property="og:title" content="About Frontline | Multimedia Production Company and Record Label">
	<meta property="og:description" content="Learn about Frontline, a multimedia production company and record label specializing in music, media, and events.">
	<meta property="og:url" content="https://frontlineug.com/about">
	<meta property="og:image" content="https://frontlineug.com/FTL_ASSETS/FTL_LOGO.webp">
	<meta property="og:image:alt" content="Frontline logo">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="About Frontline | Multimedia Production Company and Record Label">
	<meta name="twitter:description" content="Learn about Frontline, a multimedia production company and record label specializing in music, media, and events.">
	<meta name="twitter:image" content="https://frontlineug.com/FTL_ASSETS/FTL_LOGO.webp">
	<title>About Frontline | Multimedia Production Company and Record Label</title>

	<link rel="icon" href="FTL_ASSETS/FTL_FAVICON_96.png">
	<link rel="stylesheet" href="custom.css">
	<script defer src="analytics.js"></script>

	<style>
		*, *::before, *::after {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
		}

		body {
			display: flex;
			flex-direction: column;
			min-height: 100svh;
			background: #111 url("FTL_ASSETS/FTL_ROOM_BG.webp") center / cover no-repeat;
			color: #f4f1e9;
			font-family: "Instrument Serif", serif;
			font-size: clamp(1rem, 1.3vw, 1.4rem);
			-webkit-font-smoothing: antialiased;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		.about-header {
			display: flex;
			justify-content: center;
			padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 4vw, 4rem);
		}

		.about-logo {
			display: block;
			width: min(80vw, 32rem);
			transition: filter .2s ease;
		}

		.about-logo:hover {
			filter: brightness(1.3);
		}

		.about-logo img {
			display: block;
			width: 100%;
			height: auto;
		}

		.about-content {
			display: grid;
			flex: 1;
			align-content: center;
			gap: clamp(.5rem, 1.5vw, 1rem);
			place-items: center;
			padding: 2rem clamp(1.25rem, 8vw, 10rem) 6rem;
			text-align: center;
		}

		.about-content p {
			max-width: 52rem;
			margin: 0;
			font-size: clamp(1.5rem, 3vw, 3.5rem);
			line-height: 1.08;
		}

		.about-images {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: clamp(.5rem, 1.5vw, 1rem);
			width: min(100%, 64rem);
		}

		.about-images img {
			display: block;
			width: 100%;
			height: auto;
		}

		.about-footer {
			display: grid;
			grid-template-columns: 1fr auto 1fr;
			align-items: end;
			gap: 1rem;
			padding: 1.5rem clamp(1.25rem, 4vw, 4rem) 2rem;
		}

		.about-footer a {
			transition: opacity .2s ease;
		}

		.about-footer a:hover {
			opacity: .58;
		}

		.copyright {
			white-space: nowrap;
		}

		.footer-links {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: clamp(.8rem, 2vw, 2rem);
		}

		.link-star {
			display: inline-flex;
			align-items: center;
			color: #f4f1e9;
			font-size: .55em;
			line-height: 1;
			opacity: .85;
		}

		.footer-credit {
			justify-self: end;
			text-align: right;
		}

		.about-footer .footer-links {
			justify-content: center;
		}

		@media (max-width: 640px) {
			.about-footer {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				padding-bottom: 1.5rem;
			}

			.about-footer .copyright,
			.about-footer .footer-credit {
				width: 100%;
				text-align: center;
			}
		}
	</style>
</head>
<body>
	<header class="about-header">
		<a class="about-logo" href="index.html" aria-label="Back to Frontline Underground home">
			<img src="FTL_ASSETS/FTL_LOGO.webp" alt="Frontline Underground">
		</a>
	</header>

	<main class="about-content">
		<p>Frontline is a Multimedia Production Company and Record label, Specializing in Music, Media, and Events.<br>We exist to unite underground creatives who value experimentation, collaboration, and authenticity.</p>
		<div class="about-images">
			<img src="FTL_ASSETS/FTL_ABOUT_1.jpg" alt="Frontline creative production" />
			<img src="FTL_ASSETS/FTL_ABOUT_2.jpg" alt="Frontline music and media work" />
			<img src="FTL_ASSETS/FTL_ABOUT_3.jpg" alt="Frontline artists and producers" />
		</div>
	</main>

	<footer class="about-footer">
		<span class="copyright">© FRONTLINE 2026</span>
		<nav class="footer-links" aria-label="Footer links">
			<a href="https://docs.google.com/forms/d/e/1FAIpQLScA54J6IWk3UtsBhTY8FJhCq4UagszacU-_lhvyXgdBs6Xnbw/viewform?usp=header">CONTACT</a>
			<span class="link-star" aria-hidden="true">★</span>
			<a href="https://frontlineug.com/about">WHY FRONTLINE ?</a>
			<span class="link-star" aria-hidden="true">★</span>
			<a href="https://frontlineug.com/music">PARTNER</a>
		</nav>
		<a class="footer-credit" href="https://obssd.online/">DESIGNED BY OBSSD + HEARTLESS</a>
	</footer>
</body>
</html>
