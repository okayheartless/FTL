<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The artists of Frontlime Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('/FTL_ASSETS/FTL_ARTIST_CAMO.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Arial', Arial, sans-serif;
        }

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 30px 0;
}

.logo-img {
  max-width: 340px;
  cursor: pointer;
  transition: 0.25s;
}
.logo-img:hover {
  transform: scale(1.05);
}
  
/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 28px;
  padding: 0 40px 40px;
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}

.item:hover {
  transform: translateY(-4px);
}

/* IMAGE */
.thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  cursor: pointer; /* use pointer since thumbs open links */
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* NO SCALING */
.thumb:hover img {
  filter: brightness(70%);
}

/* CLICK FEEDBACK */
.thumb:active {
  transform: scale(0.98);
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.8em;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.thumb:hover .overlay {
  opacity: 1;
}

/* META ROW */
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: 0.75em;
  gap: 8px;
}

/* TITLE */
.title {
  font-family: 'Arial';
  font-size: 1.2em; /* increased for balance */
}

/* TEXT ALIGNMENT */
.title { text-align: left; }
.date { text-align: center; }
.type { text-align: right; }

/* STRETCH SYSTEM */

/* TITLE (Allegiance - horizontal stretch ONLY) */
.title span {
  display: inline-block;
  transform-origin: left;
  white-space: nowrap;
}

/* DATE + TYPE (Arial - vertical stretch ONLY) */
.date span,
.type span {
  display: inline-block;
  transform-origin: center;
  white-space: nowrap;
}

/* FOOTER */
.page-footer {
  display: flex;
  justify-content: center;
  padding: 40px 0 60px;
}
.page-footer img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="logo-container">
  <a href="https://frontlineug.com/" title="Back to Home">
    <img src="/FTL_ASSETS/FTL_LOGO.png" alt="FTL Logo">
  </a>
</div>

<div class="gallery">
  <!-- Items are generated by JavaScript from the 'artists' array below -->
</div>

<!-- FOOTER IMAGE -->
<div class="page-footer">
  <img src="/FTL_ASSETS/FTL_FOOTER.png" alt="Footer">
</div>

<script>
/*
  Fill this array with artist objects. If 'link' is set the thumbnail will open that link in a new tab;
  We removed the lightbox: thumbnails without a link will not be clickable.
  Example:
    { name: 'Artist Name', image: '/path/to/image.jpg', type: 'cover art', link: 'https://soundcloud.com/artist' }
*/
const artists = [
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },
  { name: '3hunnaracks', image: 'https://i1.sndcdn.com/avatars-wEKvVAzTBwoLzTof-oOMOEQ-t1080x1080.jpg', type: 'ARTIST', link: 'https://soundcloud.com/3hunnaracks' },

  // Add more entries here...
];

function openLink(url) {
  window.open(url, '_blank');
}

/* Generate gallery items from the artists array */
(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.textContent = a.link ? 'VIEW' : '';

    thumb.appendChild(img);
    thumb.appendChild(overlay);

    // click behavior: only add click if link is present
    if (a.link) {
      thumb.addEventListener('click', (ev) => {
        openLink(a.link);
      });
      thumb.style.cursor = 'pointer';
    } else {
      thumb.style.cursor = 'default';
    }

    const meta = document.createElement('div');
    meta.className = 'meta';

    const title = document.createElement('div');
    title.className = 'title';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = a.name;
    title.appendChild(titleSpan);

    const type = document.createElement('div');
    type.className = 'type';
    const typeSpan = document.createElement('span');
    typeSpan.textContent = a.type || '';
    type.appendChild(typeSpan);

    meta.appendChild(title);
    meta.appendChild(type);

    item.appendChild(thumb);
    item.appendChild(meta);

    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>

</body>
</html>
