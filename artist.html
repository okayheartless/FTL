<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="The artists of Frontline Underground">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist</title>
    
    <link rel="icon" href="/FTL_ASSETS/FTL_FAVICON_96.png">
    <link rel="stylesheet" href="/custom.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

body {
     background-image: url('/FTL_ASSETS/FTL_ARTIST_CAMO.jpg');
    background-attachment: fixed;
    background-size: cover;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial', Arial, sans-serif;
}

/* LOGO */
.logo-container {
  display: flex;
  justify-content: center;
  padding: 30px 16px; /* reduced side padding for small screens */
}

.logo-img {
  width: 100%;        /* make responsive */
  max-width: 600px;   /* keep original max on desktop */
  height: auto;       /* preserve aspect ratio */
  cursor: pointer;
  transition: 0.25s;
  display: block;
}
.logo-img:hover {
  transform: scale(1.05);
}
  
/* GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* slightly larger thumbs */
  gap: 28px;
  padding: 0 20px 40px; /* smaller side padding to avoid horizontal cutoff on mobile */
}

/* ITEM */
.item {
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
  transition: transform 0.2s ease;
}

.item:hover {
  transform: translateY(-4px);
}

/* IMAGE + FRAME */
.thumb {
  position: relative; /* positioning context for overlay/meta */
  width: 100%;
  /* Use the new frame aspect ratio (846 x 1440) so frames are rectangular */
  aspect-ratio: 846 / 1440;
  overflow: visible; /* allow the frame graphic to show if it extends slightly */
  cursor: pointer; /* use pointer since thumbs open links */
  display: flex;
  align-items: flex-start; /* ensure the inner image sits near the top of the frame */
  justify-content: center;
  /* frame background behind the profile image
     NOTE: the actual frame image is set per-thumb in JavaScript so each thumb can have a random frame.
     If JS is unavailable, there is no frame fallback here. */
  background-position: top center;
  background-repeat: no-repeat;
  /* make the full rectangular frame visible but preserve the frame's own ratio */
  background-size: 92% auto;
  /* enable smooth scaling on hover */
  transition: transform 0.18s ease;
  transform-origin: center;
}

/* the actual profile picture is placed inside the top portion of the rectangular frame */
.thumb img {
  position: absolute;
  top: 18%; /* moved slightly higher so image sits higher in the frame */
  left: 50%;
  transform: translateX(-50%);
  width: 72%; /* set width and let height auto to avoid stretching */
  height: auto;
  max-width: 86%;
  object-fit: cover;
  display: block;
  border-radius: 5px; /* subtle rounding if desired */
  z-index: 0; /* behind meta */
  box-shadow: 0 6px 18px rgba(0,0,0,0.3); /* subtle drop shadow */
}

/* Remove darkening on hover and instead scale the thumb slightly */
.thumb:hover {
  transform: scale(1.03);
}

/* CLICK FEEDBACK */
.thumb:active {
  transform: scale(0.98);
}

/* ensure overlay still covers full thumb area but don't darken */
.overlay {
  position: absolute;
  inset: 0;
  background: transparent; /* no dark overlay on hover */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1em;
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: 1;
  text-shadow: none; /* remove any text shadow */
}

.thumb:hover .overlay {
  opacity: 1;
}

/* place meta in the bottom part of the rectangular frame (dog tag) */
/* stacked, centered layout: artist name above the type */
.meta {
  position: absolute;
  /* move the dog tag higher (closer to top) by increasing bottom slightly */
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  width: 86%;
  display: flex;
  flex-direction: column; /* stack title and type vertically */
  justify-content: center;
  align-items: center; /* center text horizontally */
  gap: 6px; /* small vertical gap between title and type */
  font-size: 1.12em; /* slightly larger font */
  background: transparent; /* made fully transparent per request */
  color: #000; /* make font black */
  padding: 6px 12px; /* comfortable padding */
  border-radius: 12px;
  z-index: 2; /* appear above image and overlay */
  box-shadow: none; /* remove drop shadow */
  text-shadow: none; /* remove any text shadow */
  min-height: 0; /* not forcing a large tappable area so it sits closer to image */
  line-height: 1.1;
  box-sizing: border-box;
}

/* make text centered and stacked */
.title {
  font-family: 'Arial';
  font-size: 1.3em; /* larger title */
  font-weight: 600;
  color: #000; /* black font */
  text-align: center; /* centered below picture */
  text-shadow: none; /* ensure no shadow */
  overflow: visible;
  white-space: normal; /* allow wrapping if needed */
  padding-right: 0;
  padding-left: 0;
}

/* TYPE stacked under title and centered */
.type {
  font-weight: 900; /* make the 'type' font bold as requested */
  color: #000; /* black font */
  text-align: center;
  text-shadow: none;
  flex: 0 0 auto;
  margin-left: 0;
  white-space: nowrap;
  font-size: 1.02em; /* match overall meta font sizing */
}

/* DATE (not used but keep) */
.date { text-align: center; }

/* TITLE span behavior */
.title span {
  display: inline-block;
  transform-origin: left;
}

/* DATE span */
.date span,
.type span {
  display: inline-block;
  transform-origin: center;
}

       /* Footer */
        .footer-section {
            padding: 20px 0 0 0;
            text-align: center;
            margin-top: auto; /* push footer to the bottom when body is a flex column */
        }

        .footer-section img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Small tweaks for very small screens */
@media (max-width: 420px) {
  .logo-container { padding: 20px 12px; }
  .gallery { gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .title { font-size: 1.02em; }
  /* reduce profile pic size on very small screens so frame still shows */
  .thumb img { top: 16%; width: 66%; max-width: 88%; } /* moved slightly higher on tiny screens too */
  .meta { width: 92%; font-size: 1.02em; bottom: 18%; padding: 8px 12px; min-height: 0; gap: 6px; }
}

    </style>
</head>

    { name: 'Filayyy', image: 'https://i1.sndcdn.com/avatars-BYIxSNGnln95w5jy-zGcq8Q-t200x200.jpg', type: 'TN', link: 'https://soundcloud.com/matt-the-fat' },

    { name: 'Regel', image: 'https://i1.sndcdn.com/avatars-zan3ODpLP76oVzj2-x6q4NQ-t200x200.jpg', type: 'SWE', link: 'https://soundcloud.com/regelxdx' },
    { name: 'Blehsehs', image: 'FTL_ASSETS/PFP/blehsehs.jpg', type: 'SWE', link: 'https://soundcloud.com/porcelaining' },

  // Add more entries here...
];

function openLink(url) {
  window.open(url, '_blank');
}

/* Generate gallery items from the artists array */
(function renderGallery() {
  const gallery = document.querySelector('.gallery');
  gallery.innerHTML = ''; // clear any existing content

  // list of available frame images
  const frames = [
    '/FTL_ASSETS/FTL_PICTURE_FRAME1.png',
    '/FTL_ASSETS/FTL_PICTURE_FRAME2.png',
    '/FTL_ASSETS/FTL_PICTURE_FRAME3.png'
  ];

  artists.forEach((a) => {
    const item = document.createElement('div');
    item.className = 'item';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    // pick a random frame for this thumb
    const frame = frames[Math.floor(Math.random() * frames.length)];
    // set inline background-image so each thumb gets its own random frame
    thumb.style.backgroundImage = `url('${frame}')`;

    const img = document.createElement('img');
    img.src = a.image;
    img.alt = a.name;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.textContent = a.link ? 'VIEW' : '';

    // meta will be placed over the frame inside the thumb
    const meta = document.createElement('div');
    meta.className = 'meta';

    const title = document.createElement('div');
    title.className = 'title';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = a.name;
    title.appendChild(titleSpan);

    const type = document.createElement('div');
    type.className = 'type';
    const typeSpan = document.createElement('span');
    typeSpan.textContent = a.type || '';
    type.appendChild(typeSpan);

    meta.appendChild(title);
    meta.appendChild(type);

    thumb.appendChild(img);
    thumb.appendChild(overlay);
    thumb.appendChild(meta); // place meta inside thumb so it sits over the frame

    // click behavior: only add click if link is present
    if (a.link) {
      thumb.addEventListener('click', (ev) => {
        openLink(a.link);
      });
      thumb.style.cursor = 'pointer';
    } else {
      thumb.style.cursor = 'default';
    }

    item.appendChild(thumb);

    gallery.appendChild(item);
  });

  // stagger animations
  document.querySelectorAll('.item').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
  });
})();
</script>
